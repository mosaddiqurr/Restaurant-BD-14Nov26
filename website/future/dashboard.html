<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khabo for Restaurants</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232A3DB8'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Ccircle cx='19.2' cy='13' r='3.1' fill='%23F5A300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Noto+Sans+Bengali:wght@400..600&display=swap">
<link rel="stylesheet" href="future.css">
<style>
  .cont { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .band { background: var(--surface); border-bottom: 1px solid var(--line); }
  .who { display: flex; align-items: center; gap: 14px; padding: 20px 0 14px; flex-wrap: wrap; }
  .who h1 { font-size: 22px; }
  .who .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; color: var(--ink-3); font-size: 13.5px; }
  .who > div:nth-child(2) { flex: 1; min-width: 200px; }
  .band .tabs { border-bottom: 0; }
  .switcher { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
  .switcher .select { max-width: 260px; }
  #view { padding: 24px 20px 64px; }
  #view:focus { outline: none; }
  .sec-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .sec-h > div:first-child { flex: 1 1 280px; }
  .sec-h h2 { font-size: 19px; }
  .sec-h p { color: var(--ink-3); margin-top: 3px; }
  .g2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
  .g2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 860px) { .g2, .g2.even { grid-template-columns: 1fr; } }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .bar { fill: var(--indigo); }
  .chart .bar.hl { fill: #1B2A8F; }
  .chart .grid line { stroke: var(--line); }
  .chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: var(--r-tag); white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; z-index: 2; }
  .tip b { font-weight: 700; }
  .src-row { display: grid; grid-template-columns: 120px 1fr 64px; gap: 12px; align-items: center; padding: 8px 0; font-size: 13.5px; }
  .src-row .num { text-align: right; color: var(--ink-2); }
  .top-row { display: grid; grid-template-columns: 20px 40px minmax(0, 1fr) 140px 64px; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .top-row:last-child { border-bottom: 0; }
  .top-row .rank { color: var(--ink-3); font-weight: 600; text-align: right; }
  .top-row .num { text-align: right; font-weight: 600; }
  @media (max-width: 560px) { .top-row { grid-template-columns: 16px 40px minmax(0, 1fr) 56px; } .top-row .hbar { display: none; } .src-row { grid-template-columns: 96px 1fr 52px; } }
  .ins-list { display: grid; }
  .ins-list > div { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .ins-list > div:last-child { border-bottom: 0; }
  .range svg { display: block; }
  .tbl tr.peer td { background: var(--surface-2); font-size: 13px; }
  .tbl tr.exp { cursor: pointer; }
  .tbl tr.exp .caret { transition: transform .15s; color: var(--ink-3); }
  .tbl tr.exp.open .caret { transform: rotate(180deg); }
  .gate { max-width: 560px; margin: 24px auto; }
  .deal { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: start; }
  .deal:last-child { border-bottom: 0; }
  .deal .dimg { width: 72px; height: 72px; border-radius: var(--r); object-fit: cover; background: var(--sunk); }
  .deal .dimg.none { display: grid; place-items: center; color: var(--ink-3); }
  .deal .price { font-weight: 650; font-variant-numeric: tabular-nums; }
  .deal .price s { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
  .deal.paused .dimg, .deal.paused b { opacity: .55; }
  .deal-a { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 560px) { .deal { grid-template-columns: 56px minmax(0, 1fr); } .deal .dimg { width: 56px; height: 56px; } .deal-a { grid-column: 1 / -1; justify-content: flex-start; } }
  .rv { padding: 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .rv:last-child { border-bottom: 0; }
  .rv-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rv-h b { font-weight: 650; }
  .rv-t { line-height: 1.6; max-width: 720px; }
  .rv-reply { border-left: 3px solid var(--indigo-soft); padding: 4px 0 4px 12px; font-size: 13.5px; color: var(--ink-2); }
  .rv-reply b { display: block; font-size: 12.5px; color: var(--ink); }
  .rv-x { display: grid; gap: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); }
  .so-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .menu-tbl .dname { font-weight: 600; }
  .err { color: var(--red); font-size: 13px; }
  @media (max-width: 640px) {
    .cont { padding: 0 16px; }
    #view { padding: 16px 16px 48px; }
    .switcher > span { display: none; }
    .switcher .select { max-width: 190px; }
  }
  @media print {
    .band .tabs, .band .btn, .sec-h .row { display: none !important; }
    #view { padding: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="khabo prototypes"><svg class="mk" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#2A3DB8"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="19.2" cy="13" r="3.1" fill="#F5A300"/></svg><span>khabo</span><span class="brand-ctx">for restaurants</span></a>
  <span class="grow"></span>
  <label class="switcher"><span>Viewing as</span><select class="select sm" id="rsw" aria-label="Restaurant"></select></label>
  <span class="proto-note"><svg class="ico sm" aria-hidden="true"><use href="#i-info"/></svg>Prototype</span>
</header>
<div class="band"><div class="cont"><div class="who" id="who"></div><nav class="tabs" id="tabs" aria-label="Dashboard sections"></nav></div></div>
<main class="cont" id="view" tabindex="-1"></main>
<noscript><p style="padding:24px">This prototype needs JavaScript.</p></noscript>
<script src="../restaurants/list.js"></script>
<script defer src="../data/common.js"></script>
<script defer src="../code/icons.js"></script>
<script defer src="future.js"></script>
<script defer src="dashboard.js"></script>
</body>
</html>
