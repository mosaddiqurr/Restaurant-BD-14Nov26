<title>khabo · Eat out without the guesswork</title>
<meta name="description" content="Real menus, real prices and a 360° look inside restaurants in Dhaka and Bogura. Ask in Bangla, English or Banglish.">
<meta name="theme-color" content="#0C5A3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230C5A3E'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23F7F1DE' stroke-width='2.6'/%3E%3Ccircle cx='19.2' cy='13' r='3.1' fill='%23F4B91A'/%3E%3C/svg%3E">
<script>
  /* The table menu (#/t/...) and the printable menu (#/r/.../print) still open from the classic pages,
     so every printed QR code keeps working. */
  (function () { if (/^#\/(t\/|r\/[^/?]+\/print)/.test(location.hash)) location.replace('classic.html' + location.search + location.hash); })();
  /* theme before first paint, so there is no flash */
  (function () { try { var q = new URLSearchParams(location.search), th = q.get('theme') || localStorage.getItem('khabo-final-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = th; document.documentElement.lang = q.get('lang') || localStorage.getItem('khabo-final-lang') || 'en'; } catch (e) { } })();
  window.KHABO_MAIN = true;
</script>

<style>
  /* first paint, before the app loads: the header and hero shapes in khabo green, no text */
  #root > .sk { display: block; min-height: 100dvh; padding: 0; background: #F5F6F3; }
  [data-theme="dark"] #root > .sk { background: #0B120F; }
  .sk-h { height: 68px; display: flex; align-items: center; gap: 10px; padding: 0 max(32px, calc(50% - 568px)); }
  .sk-logo { width: 30px; height: 30px; border-radius: 10px; background: #0C5A3E; }
  .sk-word { width: 64px; height: 14px; border-radius: 7px; background: rgba(14, 23, 18, .12); }
  .sk-hero { height: min(660px, 80dvh); margin-top: -68px; background: #08120D; animation: skp 1.4s ease-in-out infinite alternate; }
  @keyframes skp { to { background: #0E1D16; } }
  @media (prefers-reduced-motion: reduce) { .sk-hero { animation: none; } }
</style>
