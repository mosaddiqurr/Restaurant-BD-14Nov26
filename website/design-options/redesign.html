<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khabo redesign preview</title>
<!-- Redesign preview only. Nothing here is wired to the live site.
     Design read: redesign (overhaul) of a consumer restaurant-discovery site for diners in Bangladesh plus a
     restaurant partner dashboard, premium-consumer language, keeping the khabo Indigo as the one accent.
     Dials: DESIGN_VARIANCE 7, MOTION_INTENSITY 5, VISUAL_DENSITY 4.
     Shape rule: cards 20px, photos inside cards 14px, every button and chip is a full pill, form fields 12px.
     Colour rule: khabo pages use Indigo only. A restaurant page swaps the accent for that restaurant's own colours.
     Marigold is kept only for star ratings. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Noto+Sans+Bengali:wght@400..700&family=Cormorant+Garamond:wght@600;700&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root {
  --bg: #F5F5F2; --surface: #FFFFFF; --surface-2: #EEEEEA; --ink: #14161F; --ink-2: #474B58; --ink-3: #6F7380; --line: #E2E2DC;
  --accent: #2A3DB8; --accent-ink: #FFFFFF; --accent-soft: #E8EAF8; --accent-text: #2A3DB8; --star: #D98E00; --good: #1B7A4B;
  --shadow: 0 1px 2px rgba(20, 22, 40, .05), 0 12px 32px -18px rgba(20, 22, 40, .22);
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0D0F15; --surface: #151821; --surface-2: #1C202B; --ink: #ECEDF2; --ink-2: #B6B9C4; --ink-3: #8A8E9A; --line: #252A36;
  --accent: #7183F2; --accent-ink: #0D0F15; --accent-soft: #1D2346; --accent-text: #9AA7F7; --star: #F2B13A; --good: #4FC28A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 34px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 15px/1.5 Geist, "Noto Sans Bengali", system-ui, sans-serif; color: var(--ink); background: #E7E7E2; -webkit-font-smoothing: antialiased; }
:root[data-theme="dark"] body { background: #07080C; }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
.bn { font-family: "Noto Sans Bengali", Geist, sans-serif; }

/* ============ preview shell: left rail to switch pages ============ */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100dvh; }
.rail { display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; background: #101219; color: #E9EAF0; overflow: auto; }
.rail-h { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.rail-h b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.rail-h span { font-size: 12px; color: #8C90A0; display: block; font-weight: 500; }
.rail nav { display: grid; gap: 2px; }
.rail h4 { font-size: 12px; font-weight: 600; color: #7E8294; padding: 0 10px 6px; }
.rail nav button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 99px; font-size: 14px; font-weight: 550; color: #C9CBD6; text-align: left; transition: background .2s, color .2s; }
.rail nav button i { font-size: 18px; }
.rail nav button:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.rail nav button.on { background: #fff; color: #101219; }
.rail nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 99px; font-size: 14px; font-weight: 550; color: #B9BCC8; }
.rail nav a i { font-size: 17px; }
.rail nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.rail nav a.on { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3); color: #fff; }
.rail-ctl { margin-top: auto; display: grid; gap: 12px; }
.rail-ctl label { font-size: 12px; font-weight: 600; color: #7E8294; padding: 0 4px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 99px; background: rgba(255, 255, 255, .07); }
.seg button { height: 32px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 600; color: #B9BCC8; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: #fff; color: #101219; }
.rail-note { font-size: 12px; color: #7E8294; line-height: 1.45; padding: 0 4px; }

.stage { overflow: auto; display: flex; justify-content: center; }
.frame { width: 100%; background: var(--bg); color: var(--ink); min-height: 100%; }
.app[data-view="phone"] .stage { padding: 24px 0; align-items: flex-start; }
.app[data-view="phone"] .frame { width: 390px; height: calc(100dvh - 48px); min-height: 0; overflow: auto; border-radius: 34px; box-shadow: 0 0 0 10px #15171F, 0 30px 80px rgba(0, 0, 0, .35); scrollbar-width: none; }
.screen { container-type: inline-size; container-name: screen; min-height: 100%; }
.pg { display: none; }
.pg.on { display: block; }
@media (prefers-reduced-motion: no-preference) {
  .pg.on .rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ============ shared parts ============ */
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 32px; }
@container screen (max-width: 700px) { .wrap { padding: 0 16px; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 99px; font-size: 14.5px; font-weight: 600; white-space: nowrap; transition: transform .15s var(--ease), background .2s, box-shadow .2s; }
.btn:active { transform: scale(.98); }
.btn i { font-size: 18px; }
.btn-pri { background: var(--accent); color: var(--accent-ink); }
.btn-pri:hover { box-shadow: 0 8px 20px -10px var(--accent); }
.btn-line { box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); }
.btn-line:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 15px; border-radius: 99px; font-size: 13.5px; font-weight: 550; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; transition: box-shadow .2s, background .2s; }
.chip:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.tk { display: inline-flex; align-items: baseline; gap: 1px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tk::before { content: "৳"; font-size: .72em; font-weight: 700; opacity: .65; margin-right: 1px; }
.star { color: var(--star); }
.h2 { font-size: clamp(26px, 3.2vw, 38px); font-weight: 680; letter-spacing: -.03em; line-height: 1.08; }
.sub { color: var(--ink-2); font-size: 16px; max-width: 58ch; margin-top: 10px; }
.sec { padding: 72px 0 0; }
@container screen (max-width: 700px) { .sec { padding-top: 52px; } }
.muted { color: var(--ink-3); }
.pic { background: var(--surface-2); overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: cover; }

/* site nav */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 68px; }
.logo { display: inline-flex; align-items: center; gap: 9px; font-weight: 750; font-size: 19px; letter-spacing: -.02em; }
.logo svg { width: 30px; height: 30px; }
.nav-l { display: flex; gap: 24px; font-size: 14.5px; font-weight: 550; color: var(--ink-2); }
.nav-l a:hover, .nav-l a.on { color: var(--ink); }
.nav-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 40px; height: 40px; border-radius: 99px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); font-size: 18px; }
@container screen (max-width: 860px) { .nav-l, .nav-hide { display: none; } }

/* footer */
.foot { margin-top: 88px; border-top: 1px solid var(--line); padding: 40px 0 48px; }
.foot .wrap { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 28px; font-size: 14px; color: var(--ink-2); }
.foot b { display: block; color: var(--ink); font-weight: 650; margin-bottom: 10px; font-size: 14px; }
.foot a { display: block; padding: 3px 0; }
.foot p { margin-top: 12px; max-width: 32ch; }
@container screen (max-width: 700px) { .foot .wrap { grid-template-columns: 1fr 1fr; } .foot .wrap > :first-child { grid-column: 1 / -1; } }

/* ============ HOME ============ */
.hero { padding: 56px 0 0; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 56px; align-items: center; }
.hero h1 { font-size: clamp(42px, 5.6vw, 72px); font-weight: 700; letter-spacing: -.045em; line-height: .98; max-width: 11ch; }
.hero p { font-size: 18px; color: var(--ink-2); margin-top: 20px; max-width: 40ch; }
.search { margin-top: 32px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 6px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); max-width: 540px; }
.search .where { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 14px; border-radius: 99px; font-weight: 600; font-size: 14.5px; background: var(--surface-2); }
.search input { border: 0; background: none; outline: none; font: inherit; font-size: 15px; color: var(--ink); padding: 0 12px; min-width: 0; height: 46px; }
.search input::placeholder { color: var(--ink-3); }
.search .btn { height: 46px; }
.hero-art { position: relative; aspect-ratio: 5 / 5.4; }
.hero-art .a { position: absolute; inset: 0 0 12% 14%; border-radius: 28px; }
.hero-art .b { position: absolute; left: 0; bottom: 0; width: 46%; aspect-ratio: 1; border-radius: 24px; box-shadow: 0 0 0 8px var(--bg), var(--shadow); }
@container screen (max-width: 860px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .hero h1 { font-size: 44px; }
  .hero p { font-size: 16.5px; }
  .search { grid-template-columns: minmax(0, 1fr) auto; border-radius: 22px; }
  .search .where { grid-column: 1 / -1; justify-content: flex-start; }
}

.sec-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-top: 22px; padding-bottom: 2px; }
.rail-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-top: 22px; padding-bottom: 6px; }
.rail-row > * { scroll-snap-align: start; }
@container screen (min-width: 1100px) { .rail-row { grid-auto-columns: calc((100% - 54px) / 4); } }
@container screen (max-width: 700px) { .rail-row { grid-auto-columns: 78%; } }
.rc { display: grid; gap: 12px; }
.rc .pic { aspect-ratio: 4 / 3; border-radius: 18px; }
.rc .pic img { transition: transform .8s var(--ease); }
.rc:hover .pic img { transform: scale(1.04); }
.rc h3 { font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; }
.rc .m { font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }
.rc .l { display: flex; align-items: center; gap: 12px; font-size: 13.5px; margin-top: 6px; color: var(--ink-2); }
.rc .l b { font-weight: 650; color: var(--ink); }

/* compare */
.cmp { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 20px; margin-top: 28px; }
.cmp-pick { display: grid; gap: 10px; align-content: start; }
.cmp-pick button { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; transition: box-shadow .2s, transform .2s var(--ease); }
.cmp-pick button:hover { transform: translateY(-1px); }
.cmp-pick button.on { box-shadow: inset 0 0 0 2px var(--accent); }
.cmp-pick .pic { width: 64px; height: 64px; border-radius: 14px; }
.cmp-pick b { display: block; font-size: 15.5px; font-weight: 650; }
.cmp-pick span span { font-size: 13px; color: var(--ink-3); }
.cmp-pick i { font-size: 18px; color: var(--ink-3); }
.cmp-list { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; }
.cmp-sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; padding-bottom: 18px; }
.cmp-sum .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; }
.cmp-sum p { color: var(--ink-2); font-size: 14.5px; }
.cmp-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 72px; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.cmp-row b { display: block; font-weight: 600; font-size: 15px; }
.cmp-row span.a { font-size: 13px; color: var(--ink-3); }
.cmp-row .scale { position: relative; height: 12px; }
.cmp-row .scale::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.cmp-row .scale i { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); transform: translate(-50%, -50%); left: var(--x); }
.cmp-row.low .scale i { background: var(--accent); width: 14px; height: 14px; }
.cmp-row .tk { justify-self: end; font-size: 16px; }
.cmp-row.low .tk { color: var(--accent-text); }
@container screen (max-width: 860px) { .cmp { grid-template-columns: minmax(0, 1fr); } .cmp-pick { grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; scrollbar-width: none; } }
@container screen (max-width: 520px) { .cmp-row { grid-template-columns: minmax(0, 1fr) auto; } .cmp-row .scale { display: none; } }

/* bento: see it before you go */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
.bx { border-radius: 20px; overflow: hidden; position: relative; min-height: 300px; background: var(--surface); box-shadow: var(--shadow); }
.bx-a { grid-column: span 7; grid-row: span 2; min-height: 560px; }
.bx-b { grid-column: span 5; }
.bx-c { grid-column: span 5; }
.bx-d { grid-column: span 12; min-height: 0; }
.bx-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bx-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 12, 20, 0) 45%, rgba(10, 12, 20, .78) 100%); }
.bx-cap { position: absolute; z-index: 1; left: 28px; right: 28px; bottom: 26px; color: #fff; display: grid; gap: 6px; justify-items: start; }
.bx-cap h3 { font-size: 26px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1; }
.bx-cap p { color: rgba(255, 255, 255, .82); max-width: 38ch; }
.bx-cap .btn { margin-top: 10px; background: #fff; color: #14161F; }
.bx-pad { padding: 26px; display: flex; flex-direction: column; gap: 16px; }
.bx-pad h3 { font-size: 22px; font-weight: 680; letter-spacing: -.02em; }
.bill { background: var(--surface-2); border-radius: 14px; padding: 16px 18px; display: grid; gap: 9px; font-size: 14.5px; }
.bill div { display: flex; justify-content: space-between; }
.bill .m { color: var(--ink-3); font-size: 13.5px; }
.bill .t { padding-top: 10px; border-top: 1px dashed var(--line); font-weight: 650; }
.bill .t .tk { font-size: 20px; }
.mrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mrow > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
.mrow .pic { width: 72px; height: 72px; border-radius: 14px; }
.mrow b { display: block; font-weight: 600; font-size: 15px; }
.mrow span { font-size: 13px; color: var(--ink-3); }
.bx-d .bx-pad { flex-direction: row; align-items: center; gap: 28px; }
.bx-d .bx-pad > div:first-child { flex: none; width: 260px; }
@container screen (max-width: 860px) {
  .bento > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
  .bx-a { min-height: 420px; }
  .bx-d .bx-pad { flex-direction: column; align-items: stretch; }
  .bx-d .bx-pad > div:first-child { width: auto; }
  .mrow { grid-template-columns: minmax(0, 1fr); }
}

/* deal */
.deal { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: var(--surface); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); margin-top: 28px; }
.deal .pic { min-height: 340px; }
.deal-tx { padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.deal-tx h3 { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.deal-tx p { color: var(--ink-2); }
.deal-p { display: flex; align-items: baseline; gap: 12px; margin-top: 4px; }
.deal-p .tk { font-size: 34px; letter-spacing: -.02em; }
.deal-p s { color: var(--ink-3); font-size: 16px; }
.deal-tx .btn { align-self: flex-start; margin-top: 10px; }
.deal-by { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.mono { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 750; font-size: 12px; background: #2A0C14; color: #E2B04A; flex: none; }
@container screen (max-width: 860px) { .deal { grid-template-columns: minmax(0, 1fr); } .deal .pic { min-height: 240px; } .deal-tx { padding: 26px; } }

/* for restaurants band */
.biz { margin-top: 28px; border-radius: 24px; background: #1B2470; color: #fff; display: grid; grid-template-columns: minmax(0, 1fr) 380px; overflow: hidden; }
:root[data-theme="dark"] .biz { background: #1A2160; }
.biz-tx { padding: 48px; display: grid; gap: 14px; align-content: center; justify-items: start; }
.biz-tx h2 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; max-width: 16ch; }
.biz-tx p { color: rgba(255, 255, 255, .78); max-width: 44ch; }
.biz-tx .btn { background: #fff; color: #1B2470; margin-top: 8px; }
.biz .pic { min-height: 320px; background: #141B55; }
@container screen (max-width: 860px) { .biz { grid-template-columns: minmax(0, 1fr); } .biz-tx { padding: 30px 24px; } .biz .pic { min-height: 220px; } }

/* ============ RESTAURANTS (search) ============ */
.ls-head { padding: 40px 0 0; }
.ls-head h1 { font-size: clamp(32px, 4vw, 46px); font-weight: 700; letter-spacing: -.035em; }
.ls-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.field { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 280px; color: var(--ink-3); }
.field input { border: 0; outline: 0; background: none; font: inherit; color: var(--ink); width: 100%; }
.ls-bar .sort { margin-left: auto; }
.ls { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; margin-top: 28px; }
.flt { display: grid; gap: 26px; align-content: start; position: sticky; top: 92px; }
.flt h4 { font-size: 13.5px; font-weight: 650; margin-bottom: 10px; }
.flt .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 14.5px; color: var(--ink-2); }
.chk em { font-style: normal; font-size: 13px; color: var(--ink-3); }
.tog { width: 40px; height: 24px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .25s var(--ease); }
.tog.on { background: var(--accent); }
.tog.on::after { transform: translateX(16px); }
.res { display: grid; gap: 16px; }
.res-n { font-size: 14px; color: var(--ink-3); }
.rr { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; padding: 14px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); transition: transform .3s var(--ease); }
.rr:hover { transform: translateY(-2px); }
.rr .pic { border-radius: 14px; aspect-ratio: 4 / 3; }
.rr-tx { padding: 8px 8px 8px 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rr-tx h3 { font-size: 20px; font-weight: 680; letter-spacing: -.02em; }
.rr-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); }
.rr-meta span { display: inline-flex; align-items: center; gap: 5px; }
.rr-dish { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.rr-dish span { display: inline-flex; gap: 6px; align-items: baseline; padding: 7px 12px; border-radius: 99px; background: var(--surface-2); font-size: 13.5px; }
.open { color: var(--good); font-weight: 600; }

      <div class="db-top rise"><div><h1>Menu and prices</h1><p>Change a price and it is live on your page, table QR and print menu.</p></div><div class="r"><a class="btn btn-line" href="#"><i class="ph ph-printer"></i>Print menu</a><a class="btn btn-pri" href="#"><i class="ph ph-plus"></i>Add dish</a></div></div>
      <div class="m-tabs rise" style="--i:1"><button class="chip on">All 11</button>${MENU.map(c => `<button class="chip">${c.c} ${c.d.length}</button>`).join('')}</div>
      <div class="m-head"><span></span><span>Dish</span><span>Section</span><span>Price</span><span>On the menu</span></div>
      <div class="m-list">${MENU.flatMap(c => c.d.map(d => [c.c, d])).map(([c, d], i) => `<div class="m-row rise" style="--i:${Math.min(i + 2, 10)}">${d[3] ? ph(d[3]) : '<button class="noph" aria-label="Add a photo"><i class="ph ph-camera-plus"></i></button>'}<div><b>${d[0]}</b><span class="b bn">${d[1]}</span></div><div class="cat">${c}<em>Changed ${i % 3 ? 'last week' : '2 days ago'}</em></div><label class="pin"><span>৳</span><input inputmode="numeric" value="${d[2]}" aria-label="Price of ${d[0]}" data-price></label><div class="m-on"><span>${i === 6 ? 'Sold out' : 'Available'}</span><button class="tog ${i === 6 ? '' : 'on'}" data-tog aria-label="Available"></button></div></div>`).join('')}</div>
      <div class="save" data-save><span>1 price changed</span><button class="btn btn-sm ghost" data-undo>Undo</button><button class="btn btn-pri btn-sm" data-done>Save changes</button></div>
    </main></div>`;

  /* ---------- switching ---------- */
  const PAGES = { home, list, rest, dash, menu };
  const screen = document.getElementById('screen'), app = document.querySelector('.app'), stage = document.querySelector('.stage'), frame = document.querySelector('.frame');
  let cur = 'home';
  const go = k => {
    cur = k; screen.innerHTML = `<div class="pg on">${PAGES[k]()}</div>`;
    document.querySelectorAll('.rail [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === k));
    stage.scrollTop = 0; frame.scrollTop = 0;
    try { localStorage.setItem('khabo-redesign-page', k); } catch (e) { }
  };
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const d = e.target.closest('[data-dish]'); if (d) { dishKey = d.dataset.dish; document.querySelectorAll('[data-dish]').forEach(b => b.classList.toggle('on', b === d)); document.querySelector('[data-cmp]').innerHTML = compare(); return; }
    const t = e.target.closest('[data-tog], .chk'); if (t) { (t.matches('.tog') ? t : t.querySelector('.tog')).classList.toggle('on'); return; }
    const c = e.target.closest('.chips .chip, .m-tabs .chip, .rp-tabs .chip, .seg2 button'); if (c) { c.parentElement.querySelectorAll(c.tagName).forEach(x => x.classList.toggle('on', x === c)); return; }
    if (e.target.closest('[data-undo]')) { go('menu'); return; }
    if (e.target.closest('[data-done]')) { const s = document.querySelector('[data-save]'); s.querySelector('span').textContent = 'Saved. Your page, QR menu and print menu are updated.'; setTimeout(() => s.classList.remove('on'), 1600); return; }
    const ctl = e.target.closest('[data-ctl] button'); if (ctl) {
      const g2 = ctl.parentElement, v = ctl.dataset.v; g2.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === ctl));
      if (g2.dataset.ctl === 'theme') document.documentElement.dataset.theme = v; else app.dataset.view = v;
      try { localStorage.setItem('khabo-redesign-' + g2.dataset.ctl, v); } catch (e2) { }
    }
  });
  document.addEventListener('input', e => { if (e.target.matches('[data-price]')) { const n = document.querySelectorAll('[data-price]').length; const s = document.querySelector('[data-save]'); s.classList.add('on'); s.querySelector('span').textContent = 'Price changed. Not saved yet.'; } });
  /* restore the last page and settings (per viewer, optional) */
  let start = 'home';
  try {
    const p = localStorage.getItem('khabo-redesign-page'); if (p && PAGES[p]) start = p;
    const th = localStorage.getItem('khabo-redesign-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const vw = localStorage.getItem('khabo-redesign-view') || 'desktop';
    document.querySelector(`[data-ctl="theme"] [data-v="${th}"]`).click(); document.querySelector(`[data-ctl="view"] [data-v="${vw}"]`).click();
  } catch (e) { }
  const q = new URLSearchParams(location.search);
  if (q.get('page') && PAGES[q.get('page')]) start = q.get('page');
  if (q.get('theme')) document.querySelector(`[data-ctl="theme"] [data-v="${q.get('theme')}"]`).click();
  if (q.get('view')) document.querySelector(`[data-ctl="view"] [data-v="${q.get('view')}"]`).click();
  go(start);
})();
</script>
</body>
</html>
