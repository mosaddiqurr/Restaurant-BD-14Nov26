<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khabo redesign B</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,300..800&family=Tiro+Bangla&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root {
  --green: #0C5A3E; --green-deep: #073D2A; --green-soft: #E3EEE7; --cream: #F7F1DE; --cream-2: rgba(247, 241, 222, .74);
  --red: #D23A2A; --red-ink: #FFF6F1; --gold: #F4B91A;
  --paper: #F2F4EF; --surface: #FFFFFF; --sunk: #E8ECE5; --ink: #0F1F18; --ink-2: #3B4B43; --ink-3: #5E6E66; --line: #D5DCD3;
  --good: #11704A; --warn: #A15C00; --chart: #0C5A3E; --warn-bg: #FFF1D6;
  --shadow: 0 1px 1px rgba(7, 40, 27, .05), 0 10px 24px -14px rgba(7, 40, 27, .28);
  --r: 8px; --r-lg: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --cond: "Anek Bangla", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --green: #0B4D35; --green-deep: #05271B; --green-soft: #12291F; --cream: #F4EEDA; --cream-2: rgba(244, 238, 218, .72);
  --red: #E2513F; --red-ink: #1A0806; --gold: #F6C23A;
  --paper: #0C1310; --surface: #131C18; --sunk: #18231E; --ink: #E7EEE9; --ink-2: #B3C0B9; --ink-3: #8B9A92; --line: #24322B;
  --good: #4CC88F; --warn: #F2B24C; --chart: #4CC88F; --warn-bg: #2A2112;
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 16px/1.5 var(--cond); font-variation-settings: "wdth" 100; color: var(--ink); background: #1A2620; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
::selection { background: var(--gold); color: #0F1F18; }
input, textarea { caret-color: var(--red); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.bn { font-family: var(--cond); }

/* ---------- preview shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100dvh; }
.rail { display: flex; flex-direction: column; gap: 22px; padding: 22px 14px; background: #0B1712; color: #DDE6E0; overflow: auto; scrollbar-width: thin; scrollbar-color: #2A3B33 transparent; }
.rail-h { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.rail-h b { font: 750 17px/1.1 var(--cond); font-variation-settings: "wdth" 88; letter-spacing: .01em; }
.rail-h small { display: block; font-size: 12.5px; color: #8EA197; font-weight: 450; }
.rail nav { display: grid; gap: 2px; }
.rail h4 { font-size: 12.5px; font-weight: 600; color: #7F9389; padding: 0 10px 4px; }
.rail nav button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: var(--r); font-size: 15px; font-weight: 550; color: #C3D0C8; text-align: left; }
.rail nav button i { font-size: 18px; }
.rail nav button:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.rail nav button.on { background: #0C5A3E; color: #F7F1DE; box-shadow: inset 0 0 0 1px rgba(247, 241, 222, .18); }
.rail nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14.5px; font-weight: 550; color: #C3D0C8; }
.rail nav a i { font-size: 17px; }
.rail nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.rail nav a.on { box-shadow: inset 0 0 0 1px rgba(247, 241, 222, .3); color: #F7F1DE; }
.rail-ctl { margin-top: auto; display: grid; gap: 8px; }
.rail-ctl label { font-size: 12.5px; font-weight: 600; color: #7F9389; padding: 0 4px; }
.rs { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; gap: 3px; border-radius: 10px; background: rgba(255, 255, 255, .06); }
.rs button { height: 34px; border-radius: 7px; font-size: 13.5px; font-weight: 600; color: #B7C5BD; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.rs button.on { background: #F7F1DE; color: #0B1712; }
.rail-note { font-size: 12.5px; color: #7F9389; line-height: 1.45; padding: 0 4px; margin-top: 6px; }
.stage { overflow: auto; display: flex; justify-content: center; scrollbar-color: #2A3B33 transparent; }
.frame { width: 100%; background: var(--paper); min-height: 100%; }
.app[data-view="phone"] .stage { padding: 24px 0; align-items: flex-start; }
.app[data-view="phone"] .frame { width: 390px; height: calc(100dvh - 48px); min-height: 0; overflow: auto; border-radius: 34px; box-shadow: 0 0 0 10px #0B1712, 0 30px 80px rgba(0, 0, 0, .45); scrollbar-width: none; }
.screen { container-type: inline-size; container-name: s; min-height: 100%; }

/* ---------- shared ---------- */
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 32px; }
@container s (max-width: 720px) { .wrap { padding: 0 16px; } }
.disp { font-family: var(--cond); font-variation-settings: "wdth" 78; font-weight: 800; letter-spacing: -.005em; line-height: .95; }
.h2 { font: 800 clamp(30px, 4vw, 46px)/1 var(--cond); font-variation-settings: "wdth" 80; letter-spacing: -.005em; }
.lede { color: var(--ink-2); font-size: 18px; max-width: 54ch; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: var(--r); font-weight: 650; font-size: 16px; white-space: nowrap; transition: transform .15s var(--ease), filter .2s, background .2s; }
.btn:active { transform: translateY(1px); }
.btn i { font-size: 18px; }
.btn-red { background: var(--red); color: var(--red-ink); box-shadow: 0 1px 0 rgba(0, 0, 0, .18), 0 6px 14px -8px var(--red); }
.btn-red:hover { filter: brightness(1.06); }
.btn-line { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.btn-line:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.btn-sm { height: 38px; padding: 0 14px; font-size: 14.5px; }
.tk { font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.tk::before { content: "৳"; font-size: .78em; margin-right: 1px; opacity: .85; }
.link { color: var(--green); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
:root[data-theme="dark"] .link { color: var(--gold); }
.pic { overflow: hidden; background: var(--sunk); }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.sec { padding-top: 88px; }
@container s (max-width: 720px) { .sec { padding-top: 60px; } }
@media (prefers-reduced-motion: no-preference) { .pg-in > * { animation: show .6s var(--ease) both; } }
@keyframes show { from { opacity: .001; } }

/* nav */
.nav { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 66px; }
.logo { display: inline-flex; align-items: center; gap: 9px; font: 800 24px/1 var(--cond); font-variation-settings: "wdth" 84; letter-spacing: .005em; color: var(--ink); }
.logo svg { width: 30px; height: 30px; }
.nav-l { display: flex; gap: 22px; font-weight: 550; color: var(--ink-2); }
.nav-l a:hover, .nav-l a.on { color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 8px; }
.nav-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.ib { width: 40px; height: 40px; border-radius: var(--r); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); font-size: 18px; }
@container s (max-width: 880px) { .nav-l, .nav-hide { display: none; } }

/* ============ HOME: the price board ============ */
.board { margin-top: 24px; position: relative; background: var(--green); color: var(--cream); border-radius: var(--r-lg); padding: 34px 38px 30px; box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 22px 40px -26px rgba(7, 61, 42, .7); }
.board::before { content: ""; position: absolute; inset: 9px; border: 1.5px solid rgba(247, 241, 222, .3); border-radius: 6px; pointer-events: none; }
.board h1 { font-size: clamp(46px, 7.2vw, 96px); max-width: 13ch; }
.board-sub { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; color: var(--cream-2); font-size: 17px; }
.board-sub span { display: inline-flex; align-items: center; gap: 7px; }
.ask { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font: 650 clamp(22px, 2.6vw, 30px)/1.2 var(--cond); font-variation-settings: "wdth" 92; }
.slot { position: relative; display: inline-flex; align-items: center; gap: 8px; color: var(--gold); border-bottom: 3px solid var(--gold); padding: 0 2px 2px; }
.slot select { appearance: none; -webkit-appearance: none; background: none; border: 0; color: inherit; font: inherit; font-weight: 750; padding-right: 26px; cursor: pointer; outline: none; }
.slot select option { color: #0F1F18; font-size: 16px; }
.slot i { position: absolute; right: 2px; font-size: 18px; pointer-events: none; }
.slot:focus-within { box-shadow: 0 0 0 3px rgba(244, 185, 26, .35); border-radius: 4px 4px 0 0; }
.ask .btn { margin-left: auto; }
.rows { margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 44px; border-top: 1.5px solid rgba(247, 241, 222, .22); }
.row { display: grid; grid-template-columns: minmax(0, auto) minmax(18px, 1fr) auto; align-items: baseline; gap: 12px; padding: 14px 0 12px; border-bottom: 1px dashed rgba(247, 241, 222, .2); }
.row b { font-size: 19px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row b small { display: block; font-size: 14px; font-weight: 450; color: var(--cream-2); }
.row .dots { border-bottom: 2px dotted rgba(247, 241, 222, .3); transform: translateY(-6px); }
.row .tk { font: 800 clamp(30px, 3.2vw, 42px)/1 var(--cond); font-variation-settings: "wdth" 80; color: var(--gold); }
.row.low .tk { position: relative; }
.row.low .tk::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: -6px; height: 3px; background: var(--red); border-radius: 2px; }
.row .low-t { display: inline-block; margin-left: 8px; font-size: 13px; font-weight: 700; color: #FFD9D3; }
@media (prefers-reduced-motion: no-preference) {
  .board.paint .row .tk { animation: paint .7s var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
  .board.paint .row b { animation: show .5s var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
}
@keyframes paint { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.board-f { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; margin-top: 18px; font-size: 16px; color: var(--cream-2); }
.board-f b { color: var(--cream); }
.board-f a { color: var(--cream); font-weight: 650; text-decoration: underline; text-underline-offset: 4px; }
.board-empty { grid-column: 1 / -1; padding: 30px 0; display: grid; gap: 10px; justify-items: start; font-size: 18px; }
.board-empty button { color: var(--gold); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
@container s (max-width: 860px) {
  .board { padding: 26px 20px 22px; border-radius: 0; margin: 0 -16px; }
  .board h1 { font-size: 58px; }
  .board::before { inset: 6px; }
  .rows { grid-template-columns: minmax(0, 1fr); }
  .ask .btn { margin-left: 0; width: 100%; }
}

/* near you: one featured place plus a list */
.near { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; margin-top: 28px; align-items: start; }
.feat { display: grid; gap: 14px; }
.feat .pic { aspect-ratio: 4 / 3; border-radius: var(--r-lg); }
.feat h3 { font: 800 34px/1 var(--cond); font-variation-settings: "wdth" 80; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 16px; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.star { color: #D99000; }
.open { color: var(--good); font-weight: 650; }
.plist { display: grid; }
.pl { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pl:first-child { padding-top: 0; }
.pl .pic { width: 76px; height: 76px; border-radius: var(--r); }
.pl b { font: 750 21px/1.1 var(--cond); font-variation-settings: "wdth" 86; display: block; }
.pl .meta { font-size: 14.5px; margin-top: 4px; }
.pp { text-align: right; }
.pp .tk { font: 800 24px/1 var(--cond); font-variation-settings: "wdth" 82; color: var(--green); }
:root[data-theme="dark"] .pp .tk { color: var(--gold); }
.pp small { display: block; font-size: 13px; color: var(--ink-3); }
@container s (max-width: 860px) { .near { grid-template-columns: minmax(0, 1fr); } }

/* the cash memo */
.memo-sec { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 48px; align-items: start; margin-top: 28px; }
.pick { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.dish-b { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); text-align: left; width: calc(50% - 5px); transition: transform .2s var(--ease); }
.dish-b:hover { transform: translateY(-1px); }
.dish-b .pic { width: 56px; height: 56px; border-radius: var(--r); }
.dish-b b { display: block; font-weight: 650; font-size: 16.5px; }
.dish-b .tk { color: var(--ink-3); font-size: 14.5px; }
.dish-b .add { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; background: var(--green); color: var(--cream); font-size: 17px; }
.dish-b .add em { font-style: normal; font-weight: 750; font-size: 15px; }
.memo { position: relative; background: #FFFEFA; color: #2A2018; border-radius: 4px; padding: 26px 26px 22px; box-shadow: 0 1px 2px rgba(42, 32, 24, .1), 0 18px 40px -22px rgba(42, 32, 24, .45); font-size: 16px; }
:root[data-theme="dark"] .memo { background: #F4F1E8; }
.memo::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 9px; background: radial-gradient(circle at 8px 0, transparent 7px, #FFFEFA 7.5px) -8px 0 / 16px 9px repeat-x; }
:root[data-theme="dark"] .memo::before { background: radial-gradient(circle at 8px 0, transparent 7px, #F4F1E8 7.5px) -8px 0 / 16px 9px repeat-x; }
.memo-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid #C8392B; }
.memo-h b { font: 800 26px/1 var(--cond); font-variation-settings: "wdth" 80; color: #C8392B; }
.memo-h span { font-size: 14px; color: #6B5E52; text-align: right; }
.ml { display: grid; grid-template-columns: minmax(0, 1fr) 40px 72px; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(200, 57, 43, .22); align-items: baseline; }
.ml .q { text-align: center; color: #6B5E52; }
.ml .tk { text-align: right; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .ml.new { animation: line .45s var(--ease) both; } }
@keyframes line { from { opacity: 0; transform: translateY(-6px); } }
.ml.sub { color: #6B5E52; font-size: 15px; }
.memo-t { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; }
.memo-t b { font-size: 17px; }
.memo-t .tk { font: 800 38px/1 var(--cond); font-variation-settings: "wdth" 80; color: #0C5A3E; }
.memo:has(.stamp) { padding-bottom: 92px; }
.memo-pp { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(42, 32, 24, .3); font-size: 15px; color: #4A3E33; }
.step { display: inline-flex; align-items: center; gap: 2px; border-radius: var(--r); box-shadow: inset 0 0 0 1px rgba(42, 32, 24, .2); }
.step button { width: 32px; height: 32px; display: grid; place-items: center; font-size: 15px; color: #2A2018; }
.step b { min-width: 22px; text-align: center; }
.memo-empty { padding: 26px 0 12px; color: #6B5E52; }
.stamp { position: absolute; left: 22px; bottom: 10px; width: 74px; height: 74px; color: rgba(29, 78, 160, .6); transform: rotate(-12deg); pointer-events: none; }
@container s (max-width: 860px) { .memo-sec { grid-template-columns: minmax(0, 1fr); gap: 28px; } .dish-b { width: 100%; } }

/* see inside: one decisive photo */
.inside { margin-top: 28px; position: relative; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 21 / 9; }
.inside img { width: 100%; height: 100%; object-fit: cover; }
.inside-cap { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; margin-top: 16px; }
.inside-cap p { color: var(--ink-2); font-size: 17px; max-width: 60ch; }
@container s (max-width: 720px) { .inside { aspect-ratio: 4 / 3.4; border-radius: 0; margin: 28px -16px 0; } }

/* for restaurants: the red board */
.biz { margin-top: 96px; background: var(--red); color: #FFF6F1; }
.biz .wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; padding-top: 64px; padding-bottom: 64px; align-items: center; }
.biz h2 { font: 800 clamp(36px, 5vw, 64px)/.95 var(--cond); font-variation-settings: "wdth" 78; max-width: 14ch; }
.biz p { font-size: 18px; color: rgba(255, 246, 241, .86); max-width: 46ch; }
.biz .btn { background: #FFF6F1; color: #8E1F14; margin-top: 22px; }
.biz-list { display: grid; gap: 14px; font-size: 17.5px; }
.biz-list li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.biz-list i { font-size: 22px; }
ul.biz-list { list-style: none; margin: 0; padding: 0; }
@container s (max-width: 860px) { .biz .wrap { grid-template-columns: minmax(0, 1fr); padding-top: 44px; padding-bottom: 44px; } .biz { margin-top: 64px; } }
.foot { background: var(--green-deep); color: var(--cream-2); padding: 44px 0 48px; font-size: 15px; }
.foot .wrap { display: grid; grid-template-columns: 1.5fr repeat(3, 1fr); gap: 28px; }
.foot b { color: var(--cream); display: block; margin-bottom: 8px; }
.foot a { display: block; padding: 3px 0; }
.foot a:hover { color: var(--cream); }
.foot .logo { color: var(--cream); }
@container s (max-width: 720px) { .foot .wrap { grid-template-columns: 1fr 1fr; } .foot .wrap > :first-child { grid-column: 1 / -1; } }

/* ============ RESTAURANTS ============ */
.ls-top { padding-top: 34px; }
.ls-top h1 { font-size: clamp(40px, 5.6vw, 72px); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 15px; font-weight: 550; white-space: nowrap; }
.fchip.on { background: var(--green); color: var(--cream); box-shadow: none; }
.fchip i { font-size: 16px; }
.search-in { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-width: 260px; color: var(--ink-3); }
.search-in input { border: 0; outline: 0; background: none; width: 100%; color: var(--ink); }
.search-in:focus-within { box-shadow: inset 0 0 0 2px var(--green); }
:root[data-theme="dark"] .search-in:focus-within { box-shadow: inset 0 0 0 2px var(--gold); }
.search-in input::placeholder { color: var(--ink-3); }
.sortl { margin-left: auto; color: var(--ink-2); font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
.res { margin-top: 26px; display: grid; gap: 0; }
.rr { display: grid; grid-template-columns: 260px minmax(0, 1fr) 190px; gap: 24px; padding: 22px 0; border-top: 1px solid var(--line); align-items: start; }
.rr .pic { aspect-ratio: 4 / 3; border-radius: var(--r); }
.rr .pic img, .feat .pic img, .pl .pic img { transition: transform .6s var(--ease); }
.rr:hover .pic img, .feat:hover .pic img, .pl:hover .pic img { transform: scale(1.04); }
.rr:hover h3, .pl:hover b, .feat:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.fchip:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.fchip.on:hover { box-shadow: none; }
.cats a:hover { background: var(--sunk); }
.cats a.on:hover { background: var(--own); }
.rr h3 { font: 800 32px/1 var(--cond); font-variation-settings: "wdth" 80; }
.rr .meta { margin-top: 8px; }

      <div class="top"><div><h1>Good evening, Kamal</h1><p>Your page in the last 30 days. Sample numbers.</p></div><div class="top-r"><div class="tabs" role="tablist"><button>7 days</button><button class="on">30 days</button><button>Year</button></div></div></div>
      <div class="alert" role="status"><i class="ph-fill ph-warning"></i><div><b>2 diners say Mutton Rezala costs ৳400 at the counter</b><span>Your menu shows ৳380. Fix the price or tell us it is right.</span></div><a class="btn btn-line btn-sm" href="#" data-go="menu">Check price</a></div>
      <div class="kpis"><div class="kpi"><span>People who saw your page</span><b class="num">4,812</b><em>18% more than last month</em></div><div class="kpi"><span>Table QR scans</span><b class="num">1,236</b><em>9% more</em></div><div class="kpi"><span>Calls and directions</span><b class="num">388</b><em>12% more</em></div></div>
      <div class="grid2">
        <div class="card chart"><div class="card-h"><h2>Page views each day</h2><span style="color:var(--ink-3);font-size:14.5px">Fridays are busiest</span></div>${chart()}</div>
        <div class="mini-board"><h2>Mutton kacchi in Dhanmondi</h2><p>Where your price sits on the area board. Sample places.</p><div class="mb-rows">${[['Lake Road Kacchi', 340], ['Road 8 Biryani House', 360], ['Satmasjid Handi', 380], ['Shahi Handi House', 420, 1], ['Panthapath Bawarchi', 450]].map(r => `<div class="mb-row ${r[2] ? 'me' : ''}"><b>${r[0]}${r[2] ? ' (you)' : ''}</b>${tk(r[1])}</div>`).join('')}</div><p style="margin-top:10px">Typical ${tk(380)}. Yours is ${tk(40)} above it, and still your most viewed dish.</p></div>
        <div class="card"><div class="card-h"><h2>Needs you</h2></div><div class="todo">
          <div><span class="ic"><i class="ph ph-chat-circle-dots"></i></span><div><b>Reply to Nusrat Jahan</b><span>4 stars, about the rezala</span></div><a class="btn btn-line btn-sm" href="#">Reply</a></div>
          <div><span class="ic"><i class="ph ph-camera"></i></span><div><b>5 dishes have no photo</b><span>We can shoot them on our next visit</span></div><a class="btn btn-line btn-sm" href="#" data-go="menu">See dishes</a></div>
          <div><span class="ic"><i class="ph ph-calendar-check"></i></span><div><b>Next price check: 28 Nov</b><span>Our team visits every two weeks</span></div><span></span></div></div></div>
        <div class="card"><div class="card-h"><h2>Most viewed dishes</h2><a class="link" href="#" data-go="menu">Edit menu</a></div><div class="dishv">${[['Mutton Kacchi', 'kt', 1284, 100], ['Kacchi Handi for 4', 'hd', 822, 64], ['Morog Polao', 'te', 527, 41], ['Butter Chicken', 'bw', 391, 30]].map(d => `<div>${ph(d[1])}<div><b>${d[0]}</b><span class="bar" style="--w:${d[3]}%"></span></div><span class="num" style="font-weight:650">${d[2].toLocaleString('en-IN')}</span></div>`).join('')}</div></div>
      </div>${dtabs('dash')}</main></div>`;
  const RANGE = { kt: [340, 450], hd: [1450, 1800], b4: [260, 390], te: [280, 340], sk: [200, 260], sh: [80, 110], bc: [300, 360], rz: [340, 400], na: [40, 60], br: [70, 100], fr: [90, 120] };
  const menu = () => `<div class="db">${side('menu')}<main class="main">
      <div class="top"><div><h1>Menu and prices</h1><p>A change here is live on your page, table QR and print menu.</p></div><div class="top-r"><a class="btn btn-line btn-sm" href="#"><i class="ph ph-printer"></i>Print menu</a><a class="btn btn-red btn-sm" href="#"><i class="ph ph-plus"></i>Add dish</a></div></div>
      <div class="filters"><button class="fchip on">All 11</button>${MENU.map(c => `<button class="fchip">${c.c}</button>`).join('')}</div>
      <div class="tbl" role="table" aria-label="Menu">
        <div class="tr h" role="row"><span></span><button>Dish<i class="ph ph-caret-up-down"></i></button><button>Others in Dhanmondi<i class="ph ph-caret-up-down"></i></button><button>Your price<i class="ph ph-caret-up-down"></i></button><span style="text-align:right">On the menu</span></div>
        ${MENU.flatMap(c => c.d).map(d => { const r = RANGE[d[0]], flag = d[0] === 'rz', hi = d[3] > (r[0] + r[1]) / 2 * 1.05; return `<div class="tr ${flag ? 'flag' : ''}" role="row">${d[4] ? ph(d[4]) : '<button class="noph" aria-label="Add a photo of ' + d[1] + '"><i class="ph ph-camera-plus"></i></button>'}<div><b>${d[1]}</b><span class="bnl">${d[2]}</span></div><div class="area">${tk(r[0])} to ${tk(r[1])}<em class="${hi ? 'hi' : ''}">${hi ? 'Above the usual price here' : 'Within the usual range'}</em></div><label class="pin"><span>৳</span><input inputmode="numeric" value="${d[3]}" aria-label="Price of ${d[1]}" data-price></label><div class="sw"><span>${d[0] === 'bc' ? 'Sold out' : 'Available'}</span><button class="tog ${d[0] === 'bc' ? '' : 'on'}" data-tog aria-label="${d[1]} available" aria-pressed="${d[0] !== 'bc'}"></button></div>${flag ? `<div class="flag-note"><i class="ph-fill ph-warning"></i>2 diners paid ৳400 for this at the counter on 12 and 13 Nov</div>` : ''}</div>`; }).join('')}
      </div>
      <div class="save" data-save><span>Price changed, not saved yet</span><button class="btn btn-sm" style="color:var(--cream)" data-undo>Undo</button><button class="btn btn-red btn-sm" data-done>Save</button></div>
      ${dtabs('menu')}</main></div>`;

  /* ---------- switching ---------- */
  const PAGES = { home, list, rest, dash, menu };
  const screen = document.getElementById('screen'), app = document.querySelector('.app'), stage = document.querySelector('.stage'), frame = document.querySelector('.frame');
  const go = k => {
    screen.innerHTML = `<div class="pg-in">${PAGES[k]()}</div>`;
    document.querySelectorAll('.rail [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === k));
    stage.scrollTop = 0; frame.scrollTop = 0; if (k === 'rest') paintMbar();
    try { localStorage.setItem('khabo-b-page', k); } catch (e) { }
  };
  const setCtl = (name, v) => {
    document.querySelectorAll(`[data-ctl="${name}"] button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
    if (name === 'theme') document.documentElement.dataset.theme = v; else app.dataset.view = v;
    try { localStorage.setItem('khabo-b-' + name, v); } catch (e) { }
  };
  document.addEventListener('change', e => {
    if (e.target.matches('[data-dish]')) { dish = e.target.value; repaint(); }
    if (e.target.matches('[data-area]')) { area = e.target.value; repaint(); }
  });
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); if (g.hasAttribute('data-carry')) listArea = AREAS.includes(area) && area !== 'Anywhere' && ['Dhanmondi', 'Old Dhaka', 'Gulshan', 'Mirpur'].includes(area) ? area : 'All areas'; go(g.dataset.go); return; }
    const c = e.target.closest('[data-ctl] button'); if (c) { setCtl(c.parentElement.dataset.ctl, c.dataset.v); return; }
    if (e.target.closest('[data-any]')) { area = 'Anywhere'; const s = document.querySelector('[data-area]'); if (s) s.value = 'Anywhere'; repaint(); return; }
    const a = e.target.closest('[data-add]'); if (a) {
      const k = a.dataset.add; bill[k] = (bill[k] || 0) + 1;
      document.querySelector('[data-memo-host]').innerHTML = memo(k);
      a.querySelector('[data-badge]').innerHTML = `<em class="num">${bill[k]}</em>`; return;
    }
    const p = e.target.closest('[data-ppl]'); if (p) { people = Math.max(1, Math.min(20, people + Number(p.dataset.ppl))); document.querySelector('[data-memo-host]').innerHTML = memo(); return; }
    const ra = e.target.closest('[data-radd]'); if (ra) {
      const k = ra.dataset.radd; rbill[k] = (rbill[k] || 0) + 1;
      ra.classList.add('has'); ra.innerHTML = `<i class="ph ph-check"></i>${rbill[k]} on your bill`;
      document.querySelector('[data-rmemo]').innerHTML = rMemo(k); paintMbar(); return;
    }
    const t = e.target.closest('[data-tog]'); if (t) { t.classList.toggle('on'); t.setAttribute('aria-pressed', t.classList.contains('on')); t.previousElementSibling.textContent = t.classList.contains('on') ? 'Available' : 'Sold out'; return; }
    const la = e.target.closest('[data-larea]'); if (la) { listArea = la.dataset.larea; go('list'); return; }
    const tab = e.target.closest('.tabs button, .filters .fchip, .cats a'); if (tab) { e.preventDefault(); tab.parentElement.querySelectorAll(tab.tagName).forEach(x => x.classList.toggle('on', x === tab)); return; }
    if (e.target.closest('[data-undo]')) { go('menu'); return; }
    if (e.target.closest('[data-done]')) { const s = document.querySelector('[data-save]'); s.querySelector('span').textContent = 'Saved. Page, QR menu and print menu updated.'; setTimeout(() => s.classList.remove('on'), 1700); }
  });
  document.addEventListener('input', e => { if (e.target.matches('[data-price]')) { const s = document.querySelector('[data-save]'); s.classList.add('on'); s.querySelector('span').textContent = 'Price changed, not saved yet'; } });

  let start = 'home', th = 'light', vw = 'desktop';
  try { start = localStorage.getItem('khabo-b-page') || start; th = localStorage.getItem('khabo-b-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); vw = localStorage.getItem('khabo-b-view') || vw; } catch (e) { }
  const q = new URLSearchParams(location.search);
  if (PAGES[q.get('page')]) start = q.get('page'); if (q.get('theme')) th = q.get('theme'); if (q.get('view')) vw = q.get('view');
  if (!PAGES[start]) start = 'home';
  setCtl('theme', th); setCtl('view', vw); go(start);
})();
</script>
</body>
</html>
