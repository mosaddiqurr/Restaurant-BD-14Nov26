<style>
:root {
  --bg: #F6F6F7; --surface: #FFFFFF; --sunk: #EFEFF1; --ink: #0B0B0F; --ink-2: #4A4A55; --ink-3: #6E6E78; --line: #E4E4E8; --line-2: #D4D4DA;
  --pop: #F5A300; --pop-ink: #1B1200; --pop-soft: #FFF3D6; --pop-text: #9A6200; --good: #12804F; --bad: #C93A2E;
  --shadow: 0 1px 0 rgba(11, 11, 15, .04), 0 1px 2px rgba(11, 11, 15, .06), 0 10px 30px -18px rgba(11, 11, 15, .25);
  --ring: 0 0 0 1px var(--line); --ease: cubic-bezier(.23, 1, .32, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0A0A0C; --surface: #131316; --sunk: #1A1A1E; --ink: #F4F4F6; --ink-2: #B4B4BE; --ink-3: #8A8A95; --line: #24242A; --line-2: #33333B;
  --pop: #FFB22E; --pop-ink: #1B1200; --pop-soft: #2A2110; --pop-text: #FFC45C; --good: #44C98A; --bad: #F06A5E;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 30px -18px rgba(0, 0, 0, .9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 15px/1.5 Figtree, "Noto Sans Bengali", system-ui, sans-serif; color: var(--ink); background: #E9E9EC; -webkit-font-smoothing: antialiased; }
:root[data-theme="dark"] body { background: #050506; }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
::selection { background: var(--pop); color: var(--pop-ink); }
input { caret-color: var(--pop); }
:focus-visible { outline: 2px solid var(--pop); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.boot { display: grid; place-items: center; height: 100dvh; color: #6E6E78; font: 500 15px Figtree, sans-serif; }

/* preview shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100dvh; }
.rail { display: flex; flex-direction: column; gap: 22px; padding: 20px 14px; background: #0B0B0F; color: #D9D9E0; overflow: auto; }
.rail-h { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.rail-h svg { width: 28px; height: 28px; flex: none; }
.rail-h b { font-size: 15.5px; font-weight: 700; }
.rail-h small { display: block; font-size: 12.5px; color: #85858F; }
.rail nav { display: grid; gap: 2px; }
.rail h4 { font-size: 12.5px; font-weight: 600; color: #75757F; padding: 0 10px 4px; }
.rail nav button { position: relative; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; font-weight: 550; color: #B9B9C3; text-align: left; }
.rail nav button i { font-size: 18px; position: relative; z-index: 1; }
.rail nav button span { position: relative; z-index: 1; }
.rail nav button.on { color: #0B0B0F; }
.rail nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 550; color: #B9B9C3; }
.rail nav a i { font-size: 17px; }
.rail nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.rail nav a.on { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28); color: #fff; }
.rail nav button span.rail-pill { position: absolute; inset: 0; z-index: 0; border-radius: 10px; background: #F4F4F6; }
.rail-ctl { margin-top: auto; display: grid; gap: 8px; }
.rail-ctl label { font-size: 12.5px; font-weight: 600; color: #75757F; padding: 0 4px; }
.rail-libs { font-size: 12.5px; color: #85858F; line-height: 1.5; padding: 0 4px; }
.rail-libs b { color: #D9D9E0; font-weight: 600; }
.stage { overflow: auto; display: flex; justify-content: center; }
.frame { position: relative; width: 100%; background: var(--bg); min-height: 100%; }
.app[data-view="phone"] .stage { padding: 24px 0; align-items: flex-start; }
.app[data-view="phone"] .frame { width: 390px; height: calc(100dvh - 48px); min-height: 0; overflow: auto; border-radius: 34px; box-shadow: 0 0 0 10px #16161B, 0 30px 80px rgba(0, 0, 0, .35); scrollbar-width: none; transform: translateZ(0); }
.screen { container-type: inline-size; container-name: s; min-height: 100%; }

/* segmented control with a sliding pill (motion layoutId) */
.seg { position: relative; display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--sunk); }
.seg.dark { background: rgba(255, 255, 255, .07); width: 100%; }
.seg button { position: relative; flex: 1; height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.seg.dark button { color: #9E9EA8; }
.seg button span, .seg button i { position: relative; z-index: 1; }
.seg button.on { color: var(--ink); }
.seg.dark button.on { color: #0B0B0F; }
.seg button span.seg-pill { position: absolute; inset: 0; z-index: 0; border-radius: 9px; background: var(--surface); box-shadow: 0 1px 2px rgba(11, 11, 15, .12); }
.seg.dark button span.seg-pill { background: #F4F4F6; }

/* shared */
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; }
@container s (max-width: 720px) { .wrap { padding: 0 16px; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 11px; font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: transform .16s var(--ease), background .2s, box-shadow .2s; }
.btn:active { transform: scale(.97); }
.btn i { font-size: 17px; }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-ink:hover { box-shadow: 0 6px 16px -8px rgba(11, 11, 15, .5); }
.btn-pop { background: var(--pop); color: var(--pop-ink); }
.btn-line { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-line:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.h2 { font-size: clamp(26px, 3vw, 34px); font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
.sub { color: var(--ink-2); font-size: 16px; margin-top: 8px; max-width: 56ch; }
.sec { padding-top: 80px; }
@container s (max-width: 720px) { .sec { padding-top: 56px; } }
.pic { overflow: hidden; background: var(--sunk); }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.price { font-weight: 700; font-variant-numeric: tabular-nums; }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); background: var(--surface); }
.star { color: var(--pop); }
.open { color: var(--good); font-weight: 600; }
number-flow-react { --number-flow-char-height: 1em; }

/* nav */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); box-shadow: 0 1px 0 var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.logo svg { width: 28px; height: 28px; }
.nav-l { display: flex; gap: 4px; }
.nav-l a { padding: 7px 10px; border-radius: 8px; font-weight: 550; color: var(--ink-2); font-size: 14.5px; }
.nav-l a:hover { background: var(--sunk); color: var(--ink); }
.nav-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.kbtn { display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 12px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); font-size: 14px; min-width: 250px; }
.kbtn:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.kbtn .kbd { margin-left: auto; }
@container s (max-width: 900px) { .nav-l { display: none; } .kbtn { min-width: 0; } .kbtn .kbd, .kbtn em, .big-k .kbd { display: none; } }
.kbtn em { font-style: normal; }

/* home */
.hero { padding-top: 64px; }
.hero h1 { font-size: clamp(42px, 6.4vw, 80px); font-weight: 800; letter-spacing: -.045em; line-height: .98; max-width: 14ch; }
.hero h1 span { color: var(--ink-3); }
.hero-row { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-top: 22px; }
.hero-row p { color: var(--ink-2); font-size: 18px; max-width: 46ch; }
.big-k { display: flex; align-items: center; gap: 12px; height: 54px; width: min(460px, 100%); padding: 0 10px 0 18px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); color: var(--ink-3); font-size: 16px; text-align: left; }
.big-k i { font-size: 20px; color: var(--ink); }
.big-k .kbd { margin-left: auto; }
.cmp { margin-top: 36px; display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); overflow: hidden; }
.cmp-tabs { padding: 14px; display: grid; gap: 4px; align-content: start; border-right: 1px solid var(--line); }
.cmp-tabs button { position: relative; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 11px; font-weight: 600; color: var(--ink-2); text-align: left; }
.cmp-tabs button span { position: relative; z-index: 1; }
.cmp-tabs button em { position: relative; z-index: 1; margin-left: auto; font-style: normal; color: var(--ink-3); font-size: 13px; font-weight: 500; }
.cmp-tabs button.on { color: var(--ink); }
.cmp-tabs button span.tab-pill { position: absolute; inset: 0; z-index: 0; border-radius: 11px; background: var(--sunk); }
.cmp-list { padding: 18px 24px; min-width: 0; }
.cmp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.cmp-head b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
.cmp-head > span, .cmp-head > div > span:first-child { color: var(--ink-3); font-size: 14px; }
.cmp-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(80px, 160px) 70px; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.cmp-row:last-child { border-bottom: 0; }
.cmp-row .n { color: var(--ink-3); font-size: 13px; font-weight: 600; }
.cmp-row b { font-weight: 600; display: block; }
.cmp-row small { color: var(--ink-3); font-size: 13px; }
.cmp-row .bar { height: 6px; border-radius: 3px; background: var(--ink); opacity: .14; }
.cmp-row.low .bar { background: var(--pop); opacity: 1; }
.cmp-row .price { justify-self: end; font-size: 17px; }
.cmp-row.low .price { color: var(--pop-text); }
.cmp-pic { position: relative; background: var(--sunk); }
.cmp-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@container s (max-width: 960px) { .cmp { grid-template-columns: minmax(0, 1fr); } .cmp-pic { display: none; } .cmp-tabs { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; } .cmp-tabs button { flex: none; } .cmp-tabs button em { display: none; } }
@container s (max-width: 560px) { .cmp-row { grid-template-columns: 18px minmax(0, 1fr) 64px; } .cmp-row .bar { display: none; } .cmp-list { padding: 14px 16px; } }
.rail-row { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 48px) / 4); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-top: 22px; padding: 2px 2px 8px; }
.rail-row > * { scroll-snap-align: start; }
@container s (max-width: 900px) { .rail-row { grid-auto-columns: 46%; } }
@container s (max-width: 560px) { .rail-row { grid-auto-columns: 80%; } }
.rc { display: grid; gap: 10px; }
.rc .pic { aspect-ratio: 4 / 3; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(11, 11, 15, .06); }
.rc .pic img { transition: transform .7s var(--ease); }
.rc:hover .pic img { transform: scale(1.04); }
.rc b { font-weight: 650; font-size: 16px; }
.rc .m { display: flex; gap: 10px; color: var(--ink-3); font-size: 13.5px; margin-top: 2px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 40px; margin-top: 26px; align-items: start; }
.dishes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dbtn { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); text-align: left; }
.dbtn .pic { width: 52px; height: 52px; border-radius: 10px; }
.dbtn .noph { display: grid; place-items: center; color: var(--ink-3); font-size: 20px; border: 1.5px dashed var(--line-2); background: none; }
.dbtn b { display: block; font-weight: 600; }
.dbtn span.p { color: var(--ink-3); font-size: 13.5px; }
.dbtn .plus { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--sunk); font-size: 15px; }
.dbtn .plus.has { background: var(--pop); color: var(--pop-ink); font-weight: 700; font-size: 14px; }
.billc { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); padding: 20px; }
.billc h3 { font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.bl { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14.5px; }
.bl span:first-child { color: var(--ink-2); }
.bl.m { color: var(--ink-3); font-size: 13.5px; }
.bl.m span:first-child { color: var(--ink-3); }
.btot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 6px; border-top: 1px dashed var(--line-2); }
.btot b { font-weight: 650; }
.btot .price { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.bpp { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--sunk); font-size: 14px; color: var(--ink-2); }
.stepper { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.stepper button { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; font-size: 14px; }
.stepper button:hover { background: var(--sunk); }
.stepper b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-3); padding: 18px 0 8px; font-size: 14.5px; }
@container s (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } }
@container s (max-width: 560px) { .dishes { grid-template-columns: minmax(0, 1fr); } }
.deal { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); margin-top: 26px; border-radius: 20px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.deal .pic { min-height: 320px; }
.deal-tx { padding: 34px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.deal-tx h3 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
.deal-tx p { color: var(--ink-2); }
.deal-p { display: flex; align-items: baseline; gap: 10px; }
.deal-p .price { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.deal-p s { color: var(--ink-3); }
.count { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 11px; background: var(--sunk); font-size: 14px; color: var(--ink-2); align-self: flex-start; }
.count b { color: var(--ink); font-variant-numeric: tabular-nums; }
@container s (max-width: 860px) { .deal { grid-template-columns: minmax(0, 1fr); } .deal .pic { min-height: 220px; } .deal-tx { padding: 24px; } }
.bizband { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 34px; border-radius: 20px; background: var(--ink); color: var(--bg); }
.bizband h2 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; }
.bizband p { opacity: .72; margin-top: 8px; max-width: 52ch; }
.bizband .btn { background: var(--pop); color: var(--pop-ink); }
@container s (max-width: 720px) { .bizband { grid-template-columns: minmax(0, 1fr); padding: 26px 22px; } }
.foot { margin-top: 80px; border-top: 1px solid var(--line); padding: 34px 0 44px; color: var(--ink-3); font-size: 14px; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; }
.foot nav { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }

/* cmdk palette */
.cmdk-over { position: fixed; inset: 0; z-index: 90; background: rgba(11, 11, 15, .36); backdrop-filter: blur(2px); }
[cmdk-dialog] { position: fixed; z-index: 91; top: 14vh; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: 0 24px 60px -12px rgba(11, 11, 15, .45), inset 0 0 0 1px var(--line); overflow: hidden; animation: pal .22s var(--ease); }
@keyframes pal { from { opacity: 0; transform: translateX(-50%) scale(.97); } }
[cmdk-input] { width: 100%; height: 56px; border: 0; outline: 0; background: none; padding: 0 18px; font-size: 16.5px; border-bottom: 1px solid var(--line); }
[cmdk-input]::placeholder { color: var(--ink-3); }
[cmdk-list] { max-height: min(420px, 60vh); overflow: auto; padding: 8px; scroll-padding: 8px; }
[cmdk-group-heading] { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 10px 10px 6px; }
[cmdk-item] { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 10px; border-radius: 10px; cursor: pointer; font-size: 15px; }
[cmdk-item][data-selected="true"] { background: var(--sunk); }
[cmdk-item] .pic { width: 30px; height: 30px; border-radius: 8px; flex: none; }
[cmdk-item] i { font-size: 18px; color: var(--ink-3); width: 30px; text-align: center; }
[cmdk-item] small { color: var(--ink-3); font-size: 13px; }
[cmdk-item] .price { margin-left: auto; }
[cmdk-empty] { padding: 26px 12px; color: var(--ink-3); text-align: center; }
.cmdk-foot { display: flex; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; }

/* list */
.ls-top { padding-top: 34px; }

      <${Filter} label="Price a person" icon="wallet" options=${PRICES} value=${price} onChange=${setPrice} container=${container} />

      <label className="swl"><${Switch.Root} className="sw" checked=${open} onCheckedChange=${setOpen}><${Switch.Thumb} className="sw-t" /><//>Open now</label></div>

    <${motion.div} layout className="res"><${AnimatePresence} mode="popLayout">${res.length ? res.map(x => html`<${motion.a} layout key=${x.id} className="rcard" href="#" onClick=${e => { e.preventDefault(); go('rest'); }} initial=${{ opacity: 0, scale: .96 }} animate=${{ opacity: 1, scale: 1 }} exit=${{ opacity: 0, scale: .96 }} transition=${{ layout: spring, duration: .25 }}><${Pic} k=${x.p} alt=${x.n} /><div className="t"><b>${x.n}</b><span className="price">৳${x.pp}<small style=${{ color: 'var(--ink-3)', fontWeight: 500 }}> a person</small></span></div><div className="m"><span><i className="ph-fill ph-star star"></i> ${x.r}</span><span>${x.a}</span><span>${x.c}</span>${x.open ? html`<span className="open">Open</span>` : html`<span>Opens at 3pm</span>`}</div><div className="ds">${x.d.map(d => html`<span key=${d[0]}>${d[0]} ৳${d[1]}</span>`)}</div><//>`) : html`<${motion.div} key="none" className="noresult" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }}><i className="ph ph-bowl-food" style=${{ fontSize: 28 }}></i><b>No place matches all of that</b><button className="btn btn-line btn-sm" onClick=${() => { setArea('All areas'); setPrice('any'); setCu([]); setOpen(false); }}>Clear filters</button><//>`}<//><//>
  </div><${Foot} />`;

/* ---------- RESTAURANT ---------- */
const Rest = () => {
  const { bill, add, dec, setBillOpen } = useApp(); const t = totals(bill); const [tab, setTab] = useState('Menu');
  const addOne = d => { add(d.id); toast(`${d.n} added`, { description: `৳${d.p} on your bill`, action: { label: 'Undo', onClick: () => dec(d.id) } }); };
  return html`<${Nav} /><div className="wrap">
    <div className="rp-cover"><img src=${img(R + 'shahi-handi/360/warm_restaurant_night-a.jpg')} alt="Inside Shahi Handi House" /></div>
    <div className="rp-head"><span className="rp-logo"><img src="../restaurants/shahi-handi/logo.svg" alt="Shahi Handi House logo" /></span><div><h1>Shahi Handi House</h1><div className="rp-meta"><span><i className="ph-fill ph-star star"></i><b>4.6</b> from 312</span><span>Mughlai, Dhanmondi</span><span>৳450 to ৳650 a person</span><span className="open">Open till 11:30pm</span></div></div>
      <div className="rp-acts"><button className="btn btn-line"><i className="ph ph-phone"></i>Call</button><button className="btn btn-line"><i className="ph ph-navigation-arrow"></i>Directions</button><button className="btn btn-ink"><i className="ph ph-cube"></i>360° tour</button></div></div></div>
    <nav className="rp-tabs"><div className="wrap"><${LayoutGroup} id="rt">${['Menu', 'Inside', 'Reviews', 'Visit'].map(x => html`<button key=${x} className=${clsx(tab === x && 'on')} onClick=${() => setTab(x)}>${x}${tab === x ? html`<${motion.span} layoutId="ul" className="ul" transition=${spring} />` : null}</button>`)}<//></div></nav>
    <div className="wrap"><span className="checked"><i className="ph ph-seal-check"></i>Every price checked by khabo on 14 Nov</span>
      ${CATS.map(c => html`<div key=${c}><h3 className="cat-h">${c}</h3><div className="menu">${MENU0.filter(d => d.c === c).map(d => { const q = bill[d.id] || 0; return html`<div key=${d.id} className="mi"><div><b>${d.n}</b><div className="bn">${d.bn}</div><p>${d.d}</p><div className="row"><span className="price">৳${d.p}</span><${motion.button} whileTap=${{ scale: .94 }} className=${clsx('add', q && 'has')} onClick=${() => addOne(d)}>${q ? html`<${NumberFlow} value=${q} /> added` : html`<i className="ph-bold ph-plus"></i>Add`}<//></div></div>${d.ph ? html`<${Pic} k=${d.ph} alt=${d.n} />` : html`<span></span>`}</div>`; })}</div></div>`)}
      <${AnimatePresence}>${t.n ? html`<${motion.div} key="pill" className="billpill" initial=${{ y: 80, opacity: 0 }} animate=${{ y: 0, opacity: 1 }} exit=${{ y: 80, opacity: 0 }} transition=${spring}><button onClick=${() => setBillOpen(true)}><span className="thumbs">${Object.keys(bill).slice(0, 3).map(k => html`<span key=${k}>${DISH[k].ph ? html`<img src=${img(DISH[k].ph)} alt="" />` : null}</span>`)}</span><span><${NumberFlow} value=${t.n} /> items</span><${Tk} v=${t.total} /><span className="go">View bill<i className="ph ph-arrow-up"></i></span></button><//>` : null}<//>
    </div><${Foot} />`;
};

/* ---------- DASHBOARD ---------- */
const SERIES = { 7: [212, 238, 196, 205, 262, 281, 268], 30: [118, 124, 131, 122, 140, 168, 175, 129, 133, 138, 130, 151, 183, 190, 142, 149, 161, 202, 214, 238, 196, 205, 219, 226, 262, 281, 244, 236, 251, 268], 365: [2100, 2350, 2480, 2300, 2900, 3100, 3350, 3200, 3700, 3900, 4400, 4812] };
const KPI = { 7: [1662, 431, 129, 4.6], 30: [4812, 1236, 388, 4.6], 365: [38410, 9802, 3104, 4.5] };
const Side = ({ on }) => { const { go } = useApp(); return html`<aside className="side"><span className="logo" style=${{ padding: '4px 8px' }}><${Logo} />khabo</span>
  <div className="who"><span className="rp-logo"><img src="../restaurants/shahi-handi/logo.svg" alt="" /></span><div><b>Shahi Handi House</b><span>Dhanmondi</span></div></div>
  <nav className="snav"><${LayoutGroup} id="snav">${[['dash', 'Overview', 'squares-four'], ['menu', 'Menu and prices', 'list-dashes'], ['', 'Restaurant page', 'storefront'], ['', 'Photos', 'images'], ['', 'Deals', 'tag'], ['', 'Reviews', 'chat-circle-dots', 1], ['', 'Table QR', 'qr-code'], ['', 'Print menu', 'printer'], ['', 'Price insights', 'chart-line-up']].map(([k, l, i, n]) => html`<a key=${l} href="#" className=${clsx(on === k && 'on')} onClick=${e => { e.preventDefault(); if (k) go(k); else toast('Not part of this preview', { description: l + ' stays as it is today.' }); }}>${on === k ? html`<${motion.span} layoutId="sp" className="snav-pill" transition=${spring} />` : null}<i className=${'ph ph-' + i}></i><span>${l}</span>${n ? html`<em>${n}</em>` : null}</a>`)}<//></nav>
  <div className="me" style=${{ marginTop: 'auto', fontSize: 13, color: 'var(--ink-3)', padding: '0 8px' }}>Kamal Hossain, Owner</div></aside>`; };
const DTabs = ({ on }) => { const { go } = useApp(); return html`<nav className="dtabs">${[['dash', 'Overview', 'squares-four'], ['menu', 'Menu', 'list-dashes'], ['', 'Reviews', 'chat-circle-dots'], ['', 'Photos', 'images'], ['', 'More', 'dots-three']].map(([k, l, i]) => html`<a key=${l} href="#" className=${clsx(on === k && 'on')} onClick=${e => { e.preventDefault(); if (k) go(k); }}><i className=${'ph ph-' + i}></i>${l}</a>`)}</nav>`; };
const Dash = () => {
  const { go, theme } = useApp(); const [p, setP] = useState('30'); const k = KPI[p];
  const data = SERIES[p].map((v, i) => ({ i, v, label: p === '365' ? ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'][i] : p === '7' ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][i] : `${((16 + i) % 31) + 1} ${i < 15 ? 'Oct' : 'Nov'}` }));
  const ink = theme === 'dark' ? '#FFB22E' : '#0B0B0F', grid = theme === 'dark' ? '#24242A' : '#E4E4E8', axis = theme === 'dark' ? '#8A8A95' : '#6E6E78';
  const Tip = ({ active, payload }) => active && payload && payload.length ? html`<div className="tt"><b>${payload[0].value.toLocaleString('en-IN')} views</b>${payload[0].payload.label}</div>` : null;
  return html`<div className="db"><${Side} on="dash" /><main className="main">
    <div className="top"><div><h1>Good evening, Kamal</h1><p>How your page is doing. Sample numbers.</p></div><div className="top-r"><${Seg} id="period" items=${[['7', '7 days'], ['30', '30 days'], ['365', 'Year']]} value=${p} onChange=${setP} /></div></div>
    <div className="alert" role="status"><i className="ph-fill ph-warning"></i><div><b>2 diners paid ৳400 for Mutton Rezala</b><span>Your menu says ৳380. Fix it or tell us the menu is right.</span></div><button className="btn btn-ink btn-sm" onClick=${() => go('menu')}>Check price</button></div>
    <div className="kpis">${[['People who saw your page', 'eye', k[0], '+18%'], ['Table QR scans', 'qr-code', k[1], '+9%'], ['Calls and directions', 'phone', k[2], '+12%'], ['Rating from diners', 'star', k[3], '12 new reviews']].map(([l, i, v, d]) => html`<div key=${l} className="kpi"><span><i className=${'ph ph-' + i}></i>${l}</span><span className="v"><${NumberFlow} value=${v} locales="en-IN" format=${{ maximumFractionDigits: 1 }} /></span><em>${d}</em></div>`)}</div>
    <div className="g2"><div className="card"><div className="card-h"><h2>Page views</h2><span>Hover the line for each day</span></div><div className="chart"><${ResponsiveContainer} width="100%" height="100%"><${AreaChart} data=${data} margin=${{ top: 8, right: 6, left: -18, bottom: 0 }}>
        <defs><linearGradient id="fillv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor=${ink} stopOpacity=${.16} /><stop offset="100%" stopColor=${ink} stopOpacity=${0} /></linearGradient></defs>
        <${CartesianGrid} vertical=${false} stroke=${grid} /><${XAxis} dataKey="label" tick=${{ fill: axis, fontSize: 12 }} tickLine=${false} axisLine=${false} interval="preserveStartEnd" minTickGap=${28} /><${YAxis} tick=${{ fill: axis, fontSize: 12 }} tickLine=${false} axisLine=${false} width=${48} />
        <${Tooltip} content=${html`<${Tip} />`} cursor=${{ stroke: axis, strokeDasharray: '3 3' }} />
        ${p === '30' ? html`<${ReferenceLine} x=${data[16].label} stroke="#F5A300" strokeDasharray="4 4" label=${{ value: 'Video menu live', fill: '#C27F00', fontSize: 12, position: 'insideTopLeft' }} />` : null}
        <${Area} type="monotone" dataKey="v" stroke=${ink} strokeWidth=${2.2} fill="url(#fillv)" animationDuration=${700} />
      <//><//></div></div>
      <div className="card"><div className="card-h"><h2>Needs you</h2></div><div className="todo">
        <div><span className="ic"><i className="ph ph-chat-circle-dots"></i></span><div><b>Reply to Nusrat Jahan</b><span>4 stars, about the rezala</span></div><button className="btn btn-line btn-sm" onClick=${() => toast.success('Reply sent to Nusrat Jahan')}>Reply</button></div>
        <div><span className="ic"><i className="ph ph-camera"></i></span><div><b>3 dishes have no photo</b><span>We can shoot them on our next visit</span></div><button className="btn btn-line btn-sm" onClick=${() => toast('Photo visit requested', { description: 'Our team will call you to pick a day.' })}>Book</button></div>
        <div><span className="ic"><i className="ph ph-calendar-check"></i></span><div><b>Next price check: 28 Nov</b><span>Our team visits every two weeks</span></div><span></span></div></div></div></div>
    <${DTabs} on="dash" /></main></div>`;
};
const SortRow = ({ d, onPrice, onToggle }) => {
  const { attributes, listeners, setNodeRef, transform, transition, isDragging } = useSortable({ id: d.id });
  return html`<div ref=${setNodeRef} className=${clsx('mrow', isDragging && 'dragging')} style=${{ transform: CSS.Transform.toString(transform), transition }}>
    <button className="handle" aria-label=${'Move ' + d.n} ...${attributes} ...${listeners}><i className="ph ph-dots-six-vertical"></i></button>
    ${d.ph ? html`<${Pic} k=${d.ph} />` : html`<button className="noph" aria-label=${'Add a photo of ' + d.n} onClick=${() => toast('Photo upload opens here')}><i className="ph ph-camera-plus"></i></button>`}
    <div><b>${d.n}</b><span className="bn">${d.bn}</span></div><span className="cat">${d.c}</span>
    <label className="pin"><span>৳</span><input inputMode="numeric" value=${d.p} onChange=${e => onPrice(d.id, e.target.value.replace(/\D/g, ''))} aria-label=${'Price of ' + d.n} /></label>
    <label className="avail">${d.on ? 'Available' : 'Sold out'}<${Switch.Root} className="sw" checked=${d.on} onCheckedChange=${v => onToggle(d.id, v)}><${Switch.Thumb} className="sw-t" /><//></label></div>`;
};
const Menu = () => {
  const [items, setItems] = useState(() => MENU0.map(d => ({ ...d }))); const [dirty, setDirty] = useState(0);
  const sensors = useSensors(useSensor(PointerSensor, { activationConstraint: { distance: 4 } }), useSensor(KeyboardSensor, { coordinateGetter: sortableKeyboardCoordinates }));
  const bump = () => setDirty(n => n + 1);
  const end = ({ active, over }) => { if (over && active.id !== over.id) { setItems(xs => arrayMove(xs, xs.findIndex(x => x.id === active.id), xs.findIndex(x => x.id === over.id))); bump(); } };
  const saveAll = () => { toast.promise(new Promise(r => setTimeout(r, 900)), { loading: 'Saving your menu...', success: 'Saved. Your page, table QR and print menu are updated.', error: 'Could not save. Try again.' }); setDirty(0); };
  return html`<div className="db"><${Side} on="menu" /><main className="main">
    <div className="top"><div><h1>Menu and prices</h1><p>Drag to change the order diners see. Prices go live everywhere when you save.</p></div><div className="top-r"><button className="btn btn-line btn-sm"><i className="ph ph-printer"></i>Print menu</button><button className="btn btn-ink btn-sm" onClick=${() => toast('A new dish form opens here')}><i className="ph ph-plus"></i>Add dish</button></div></div>
    <div className="mhead"><span></span><span></span><span>Dish</span><span>Section</span><span>Price</span><span>On the menu</span></div>
    <${DndContext} sensors=${sensors} collisionDetection=${closestCenter} onDragEnd=${end}><${SortableContext} items=${items.map(x => x.id)} strategy=${verticalListSortingStrategy}><div className="mlist">${items.map(d => html`<${SortRow} key=${d.id} d=${d} onPrice=${(id, v) => { setItems(xs => xs.map(x => x.id === id ? { ...x, p: v === '' ? '' : Number(v) } : x)); bump(); }} onToggle=${(id, v) => { setItems(xs => xs.map(x => x.id === id ? { ...x, on: v } : x)); bump(); toast(v ? 'Back on the menu' : 'Marked sold out', { description: DISH[id].n }); }} />`)}</div><//><//>
    <${AnimatePresence}>${dirty ? html`<${motion.div} key="sb" className="savebar" initial=${{ y: 30, opacity: 0 }} animate=${{ y: 0, opacity: 1 }} exit=${{ y: 30, opacity: 0 }} transition=${spring}><span><${NumberFlow} value=${dirty} /> unsaved ${dirty === 1 ? 'change' : 'changes'}</span><button className="btn btn-line btn-sm" onClick=${() => { setItems(MENU0.map(d => ({ ...d }))); setDirty(0); toast('Changes undone'); }}>Undo</button><button className="btn btn-pop btn-sm" onClick=${saveAll}>Save</button><//>` : null}<//>
    <${DTabs} on="menu" /></main></div>`;
};

/* ---------- shell ---------- */
const PAGES = { home: Home, list: List, rest: Rest, dash: Dash, menu: Menu };
const App = () => {
  const { page, theme, view, go, setTheme, setView } = useApp(); const frame = useRef(null); const [box, setBox] = useState(null);
  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => { setBox(frame.current); }, []);
  useEffect(() => { const st = document.querySelector('.stage'); if (st) st.scrollTop = 0; if (frame.current) frame.current.scrollTop = 0; }, [page]);
  const Page = PAGES[page] || Home;
  return html`<div className="app" data-view=${view}>
    <aside className="rail"><div className="rail-h"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#F4F4F6"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#0B0B0F" stroke-width="2.6"/><circle cx="19.2" cy="13" r="3.1" fill="#F5A300"/></svg><div><b>khabo redesign C</b><small>Preview only, not live</small></div></div>
      <nav><h4>Diner site</h4><${LayoutGroup} id="rail">${[['home', 'Home', 'house'], ['list', 'Restaurants', 'list-magnifying-glass'], ['rest', 'Restaurant page', 'storefront']].map(([k, l, i]) => html`<button key=${k} className=${clsx(page === k && 'on')} onClick=${() => go(k)}>${page === k ? html`<${motion.span} layoutId="rp" className="rail-pill" transition=${spring} />` : null}<i className=${'ph ph-' + i}></i><span>${l}</span></button>`)}<//></nav>
      <nav><h4>Partner dashboard</h4><${LayoutGroup} id="rail2">${[['dash', 'Overview', 'squares-four'], ['menu', 'Menu and prices', 'list-dashes']].map(([k, l, i]) => html`<button key=${k} className=${clsx(page === k && 'on')} onClick=${() => go(k)}>${page === k ? html`<${motion.span} layoutId="rp2" className="rail-pill" transition=${spring} />` : null}<i className=${'ph ph-' + i}></i><span>${l}</span></button>`)}<//></nav>
      <nav aria-label="Compare designs"><h4>Compare</h4><a className="" href="current.html"><i className="ph ph-circle-half"></i>Current site</a><a className="" href="redesign.html"><i className="ph ph-number-circle-one"></i>Redesign A</a><a className="" href="redesign-b.html"><i className="ph ph-number-circle-two"></i>Redesign B</a><a className="on" href="redesign-c.html"><i className="ph ph-number-circle-three"></i>Redesign C</a><a href="final.html"><i className="ph ph-star-four"></i>Final</a></nav><div className="rail-ctl"><label>Look</label><${Seg} id="th" dark items=${[['light', 'Light', 'sun'], ['dark', 'Dark', 'moon']]} value=${theme} onChange=${setTheme} /><label>Screen</label><${Seg} id="vw" dark items=${[['desktop', 'Laptop', 'desktop'], ['phone', 'Phone', 'device-mobile']]} value=${view} onChange=${setView} />
        <p className="rail-libs">Built with <b>base-ui</b>, <b>cmdk</b>, <b>Sonner</b>, <b>Vaul</b>, <b>input-otp</b>, <b>motion</b>, <b>NumberFlow</b>, <b>recharts</b>, <b>dnd kit</b>, <b>zustand</b> and <b>clsx</b>. Try Ctrl K.</p></div></aside>
    <main className="stage"><div className="frame" ref=${frame}><div className="screen">
      <${AnimatePresence} mode="wait"><${motion.div} key=${page} initial=${{ opacity: 0, y: 6 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0 }} transition=${{ duration: .22, ease: [.23, 1, .32, 1] }}><${Page} container=${box} /><//><//>
    </div>${box ? html`<${Palette} container=${box} /><${SignIn} container=${box} /><${BillDrawer} container=${box} />` : null}</div></main>
    <${Toaster} theme=${theme} position="top-center" richColors=${false} closeButton=${false} toastOptions=${{ style: { fontFamily: 'Figtree, sans-serif', borderRadius: '14px' } }} />
  </div>`;
};
createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
