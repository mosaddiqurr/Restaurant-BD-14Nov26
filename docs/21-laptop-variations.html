<style>
*{box-sizing:border-box;margin:0}
body{background:#0f1012;color:#e9e9e6;font:15px/1.5 Onest,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:9;background:rgba(15,16,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid #2a2c31}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid #2f3136;background:#17181b;color:#b9bac0;border-radius:999px;min-height:40px;padding:0 14px;font-size:13.5px;white-space:nowrap}
.tabs button.on{background:#f1f1ee;color:#111;border-color:#f1f1ee;font-weight:600}
.stage{padding:26px 24px 50px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lbl{font-size:13px;color:#8d8f96;margin:16px 0 4px;align-self:center}
.fit{position:relative;width:100%;max-width:1280px}
.lap{position:absolute;top:0;left:0;width:1280px;transform-origin:0 0;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px #33353b,0 40px 80px -40px #000}
.chrome{height:40px;background:var(--ub);display:flex;align-items:center;gap:8px;padding:0 14px}
.chrome .d{width:12px;height:12px;border-radius:50%}
.chrome .u{flex:1;max-width:560px;margin:0 auto;background:var(--up);border-radius:8px;height:26px;display:flex;align-items:center;justify-content:center;gap:6px;font:12.5px system-ui,sans-serif;color:var(--ut)}
.vp{height:760px;overflow-y:auto;position:relative;background:var(--bg);color:var(--tx);font-family:var(--fb),"Noto Sans Bengali",sans-serif;font-size:15px;line-height:1.5;scrollbar-width:thin}
.f{display:flex}.fc{display:flex;flex-direction:column}.ac{align-items:center}.jb{justify-content:space-between}.w{flex-wrap:wrap}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g20{gap:20px}
.W{padding-left:56px;padding-right:56px}
.mu{color:var(--mu)}.ok{color:#1c8a52}.b{font-weight:700}
.s11{font-size:11px}.s12{font-size:12px}.s13{font-size:13px}.s16{font-size:16px}.s18{font-size:18px}.s22{font-size:22px}
.fd{font-family:var(--fd),"Noto Sans Bengali",sans-serif}

.cd{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rd)}
.ln{border-bottom:1px solid var(--ln)}
.bt{border:0;background:var(--br);color:var(--ob);border-radius:var(--rb);min-height:44px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14.5px}
.bt.o{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--ln)}
.bt.wh{background:#fff;color:#111}
.in{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;border-radius:var(--rb);background:var(--sf);border:1px solid var(--ln);color:var(--mu);font-size:15px}
.ch{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:13.5px;white-space:nowrap}
.ch.on{background:var(--br);color:var(--ob);border-color:var(--br)}
.dh{display:flex;align-items:center;gap:36px;padding:18px 56px}
.dh nav{display:flex;gap:28px;font-size:14.5px;flex:1}
.lg{font-size:26px;letter-spacing:-.02em;font-weight:var(--fw)}
.tb{display:flex;gap:26px;border-bottom:1px solid var(--ln)}
.tb span{padding:12px 0;white-space:nowrap;color:var(--mu);font-size:14.5px;border-bottom:2.5px solid transparent}

.dr{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.ad{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--br);color:var(--br);display:grid;place-items:center;flex:none}
.g4c{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}

.stk{position:absolute;top:12px;right:12px;background:var(--ac);color:#111;font-weight:800;font-size:13px;padding:4px 9px;transform:rotate(3deg)}
.sg{display:inline-flex;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--tx) 8%,transparent)}
.sg span{padding:10px 22px;border-radius:999px;font-size:14px;color:var(--mu);cursor:pointer;white-space:nowrap}
.sg .on{background:var(--sf);color:var(--tx);font-weight:700;box-shadow:0 1px 4px #0002}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#fff8}.dots i.on{background:#fff;width:20px;border-radius:4px}
.orn{width:80px;height:10px;margin:12px auto;border-top:1px solid var(--br);border-bottom:1px solid var(--br)}
.ldr{display:flex;align-items:baseline;gap:8px;padding:7px 0}.ldr i{flex:1;border-bottom:1.5px dotted var(--mu)}
.icb{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--br) 12%,transparent);color:var(--br);display:grid;place-items:center;font-size:23px}
.cpn{display:flex;justify-content:space-between;align-items:center;gap:14px;border:2px dashed var(--br);border-radius:var(--rd);padding:16px 18px;background:var(--sf)}
.tag{font-size:11px;font-weight:800;background:var(--ac);color:#111;padding:1px 7px;border-radius:5px}
.side{position:sticky;top:20px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#fffe;color:#111;display:grid;place-items:center;font-size:28px}

<script>
const P={k:'photo-1563379091339-03b21ab4a4f8',kt:'photo-1589302168068-964664d93dc0',te:'photo-1631515243349-e0cb75fb8d3a',po:'photo-1588644525273-f37b60d78512',th:'photo-1743674453123-93356ade2891',ch:'photo-1599487488170-d11ec9c172f0',na:'photo-1565557623262-b51c2513a641',fi:'photo-1652954008429-ce394eacbd7f',fu:'photo-1781243680771-1fea4521e196',pl:'photo-1633945274405-b6c8069047b0',in:'photo-1517248135467-4c7edcad34c4',ro:'photo-1526069631228-723c945bea6b',di:'photo-1709548145082-04d0cde481d4'};
const D=[['kt','Mutton Kacchi Biryani',380,'1 plate'],['te','Beef Tehari',220,'1 plate'],['po','Morog Polao',290,'1 plate'],['ch','Chicken Chap',180,'1 piece'],['na','Butter Naan',50,'1 piece'],['fi','Shorshe Ilish',650,'1 piece'],['fu','Fuchka',120,'8 pieces'],['pl','Family Platter',1990,'serves 4']];

const fx=()=>`<div class="f w g8">${[['wallet','৳450-650/person'],['car-profile','18 min'],['clock','Open till 11:30 pm'],['users-three','Family cabin'],['mosque','Prayer room'],['car','Parking']].map(([i,t])=>`<span class="ch">${ic(i)}${t}</span>`).join('')}</div>`;

const SIX=[['৳450-650','per person'],['18 min','in traffic now'],['11:30 pm','open until'],['4.6 ★','312 verified'],['Cabin','family'],['2 days','prices checked']];

/* LAYOUTS: [home, restaurant, menu] */
const L={
1:[
()=>nav()+`<section class="W" style="display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding-top:34px;padding-bottom:40px"><div><h1 class="H fd">Eat out.<br>Know the price first.</h1><div class="cd f ac" style="margin-top:30px;padding:8px;border-radius:var(--rb);box-shadow:0 18px 40px -26px #0005"><div class="f ac g8 mu" style="flex:1.3;padding:0 14px">${ic('magnifying-glass')}Dish or restaurant</div><div class="f ac g8 mu" style="flex:1;padding:0 14px;border-left:1px solid var(--ln)">${ic('map-pin')}Dhanmondi, Dhaka</div><button class="bt" style="min-height:50px;padding:0 28px">Search</button></div><div class="f w g8" style="margin-top:16px">${chips(['Kacchi','Under ৳500','Family cabin','Rooftop','Open now','Iftar'],-1)}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:440px">${im('k','border-radius:var(--rd);height:440px',700)}<div class="fc g12">${im('th','border-radius:var(--rd);flex:1',500)}${im('fu','border-radius:var(--rd);flex:1',500)}</div></div></section><section class="W" style="padding-bottom:40px"><div class="f jb ac" style="margin-bottom:16px"><b class="s22">Near you, open now</b><span class="mu s13">See all ${ic('arrow-right')}</span></div>${g4(180)}</section>`,
()=>nav()+`<div class="W"><div class="s13 mu" style="margin-bottom:14px">Dhaka › Dhanmondi › Mughlai</div>${gal()}<div style="display:grid;grid-template-columns:1fr 360px;gap:48px;margin-top:28px;padding-bottom:40px"><div>${NM()}<div class="s13" style="margin:8px 0 16px">${rate()}</div>${fx()}<div style="margin-top:24px">${tabs(['Menu','Photos & video','360° tour','Kitchen','Reviews','Deals','Info'])}</div>${grid2(D.slice(0,6))}</div><div>${side()}</div></div></div>`,
()=>nav()+`<div class="W" style="display:grid;grid-template-columns:220px 1fr 340px;gap:40px;padding-top:20px;padding-bottom:40px"><div class="side" style="align-self:start"><div class="f g12 ac" style="margin-bottom:20px">${im('k','width:52px;height:52px;border-radius:12px;flex:none',200)}<b>Shahi Handi House</b></div>${CT.map((c,i)=>`<div style="padding:10px 14px;border-radius:10px;${i?'':'background:var(--sf);font-weight:700;color:var(--br)'}">${c}</div>`).join('')}</div><div><h2 class="H2 fd">Biryani & Rice</h2><div class="s13 ok" style="margin:6px 0 10px">${ic('seal-check',1)} Prices checked 2 days ago</div>${D.slice(0,6).map(dr).join('')}</div><div>${bill()}</div></div>`
],
3:[
()=>`<section style="height:760px;position:relative;color:#fff">${im('k','position:absolute;inset:0',1600)}<div style="position:absolute;inset:0;background:linear-gradient(#000a,#0000 26%,#0000 50%,#000d)"></div><div style="position:relative">${nav({wh:1})}</div><div class="W" style="position:absolute;left:0;right:0;bottom:56px"><div class="f jb" style="align-items:flex-end;gap:40px"><div style="width:720px"><div class="s13" style="opacity:.9;margin-bottom:12px">Mutton Kacchi · Shahi Handi House, Dhanmondi · <b>৳380</b></div><div class="in" style="background:#fff;color:#555;border:0;min-height:64px;padding-right:8px;font-size:16px">${ic('magnifying-glass')}<span style="flex:1">Search dishes, restaurants or areas</span><button class="bt" style="min-height:48px">${ic('sparkle',1)}Ask AI</button></div><div class="f g8" style="margin-top:12px">${chips(['Open now','Under ৳500','Family cabin','Near me','Rooftop'],-1,'background:#fff2;border-color:#fff5;color:#fff')}</div></div><div class="f g12 ac"><span class="dots"><i class="on"></i><i></i><i></i><i></i></span><span class="ch" style="background:#fff2;border-color:#fff5;color:#fff">${ic('caret-left')}</span><span class="ch" style="background:#fff2;border-color:#fff5;color:#fff">${ic('caret-right')}</span></div></div></div></section><section class="W" style="padding-top:40px;padding-bottom:40px"><b class="s22">Near you</b>${g4(200,'margin-top:16px')}</section>`,
()=>`<section style="height:500px;position:relative;color:#fff">${im('in','position:absolute;inset:0',1600)}<div style="position:absolute;inset:0;background:linear-gradient(#000a,#0000 30%,#0000 45%,#000d)"></div><div style="position:relative">${nav({wh:1})}</div><div class="W f jb" style="position:absolute;left:0;right:0;bottom:36px;align-items:flex-end"><div>${NM(56)}<div class="s13" style="margin-top:6px"><b>${ic('star',1)} 4.6</b> · 312 verified reviews · Dhanmondi 27 · Mughlai, Bengali</div></div><div class="f g8"><button class="bt wh">${ic('phone')}Call</button><button class="bt wh">${ic('whatsapp-logo')}WhatsApp</button><button class="bt">${ic('navigation-arrow',1)}Directions</button></div></div></section><div class="W" style="display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--ln);border-bottom:1px solid var(--ln)">${SIX.map(([a,b])=>`<div style="background:var(--bg);padding:18px 4px;text-align:center"><b class="s18" style="display:block">${a}</b><span class="s12 mu">${b}</span></div>`).join('')}</div><div class="W" style="padding-top:20px;padding-bottom:40px">${tabs(['Menu','Photos & video','360° tour','Kitchen','Reviews','Info'])}${grid2(D.slice(0,6))}</div>`,
()=>nav()+`<div class="W f jb ac" style="padding-bottom:16px"><div class="f g12 ac">${im('k','width:48px;height:48px;border-radius:12px',200)}<div><b class="s18">Shahi Handi House</b><div class="s12 ok">${ic('seal-check',1)} Prices checked 2 days ago</div></div></div><div class="f g8">${chips(CT.slice(0,5))}</div></div><div class="W" style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:40px">${D.slice(0,6).map(d=>`<div class="im" style="height:270px;border-radius:var(--rd)">${I(d[0],600)}<div class="cap" style="flex-direction:row;justify-content:space-between;align-items:flex-end"><div><b class="s18">${d[1]}</b><div class="s13">${d[3]}</div></div><b class="s22">৳${d[2]}</b></div></div>`).join('')}</div>`
