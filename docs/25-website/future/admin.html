<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khabo Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232A3DB8'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Ccircle cx='19.2' cy='13' r='3.1' fill='%23F5A300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Noto+Sans+Bengali:wght@400..600&display=swap">
<link rel="stylesheet" href="future.css">
<style>
  .shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: calc(100vh - var(--bar)); }
  .side { position: sticky; top: var(--bar); height: calc(100vh - var(--bar)); overflow: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .side a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r); color: var(--ink-2); font-weight: 500; white-space: nowrap; }
  .side a:hover { background: var(--sunk); text-decoration: none; }
  .side a.on { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }
  .side a .count { margin-left: auto; }
  .side .ico { color: inherit; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .side-foot { margin-top: auto; padding: 12px 10px 4px; font-size: 12.5px; color: var(--ink-3); display: grid; gap: 6px; }
  #main { padding: 24px 28px 64px; min-width: 0; max-width: 1320px; }
  #main:focus { outline: none; }
  .user { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .grow-1 { flex: 1; min-width: 0; }
  .menu-tbl td:nth-child(2) { min-width: 120px; }
  .menu-tbl .dname { font-weight: 600; }
  .status-line { display: flex; align-items: center; gap: 8px; }

  /* reviews */
  .rv-list { display: grid; gap: 12px; }
  .rv { padding: 16px; display: grid; gap: 10px; }
  .rv-h { display: flex; align-items: center; gap: 10px; }
  .rv-h .sub { display: block; font-size: 12.5px; color: var(--ink-3); }
  .rv-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .rv-t { font-size: 14.5px; line-height: 1.6; max-width: 760px; }
  .rv-reply { border-left: 3px solid var(--indigo-soft); padding: 4px 0 4px 12px; font-size: 13.5px; color: var(--ink-2); }
  .rv-reply b { display: block; font-size: 12.5px; color: var(--ink); margin-bottom: 2px; }
  .rv-a { display: flex; gap: 8px; flex-wrap: wrap; }
  .rv-x { display: grid; gap: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); }

  /* leads board */
  .board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
  .col { background: var(--sunk); border-radius: var(--r-card); padding: 10px; min-height: 280px; display: flex; flex-direction: column; gap: 8px; transition: background .12s; }
  .col.over { background: var(--indigo-soft); box-shadow: inset 0 0 0 2px var(--indigo); }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 650; }
  .col-h .count { background: var(--surface); }
  .col-empty { color: var(--ink-3); font-size: 13px; text-align: center; padding: 24px 8px; border: 1px dashed var(--line-2); border-radius: var(--r); }
  .lead { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; }
  .lead:hover { border-color: var(--line-2); }
  .lead[draggable="true"] { cursor: grab; }
  .lead.dragging { opacity: .45; }
  .lead b { font-weight: 650; }
  .lead .mv { justify-self: start; margin-left: -8px; }
  .log { display: grid; gap: 8px; max-height: 180px; overflow: auto; }
  .log div { font-size: 13px; color: var(--ink-2); }
  .log span { color: var(--ink-3); font-size: 12px; display: block; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  /* bulk paste */
  .mono-text { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
  .cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .cards2 { grid-template-columns: 1fr; } }
  .perm td, .perm th { text-align: center; }
  .perm td:first-child, .perm th:first-child { text-align: left; }
  .cell-ok { color: var(--green); font-weight: 600; }
  .cell-view { color: var(--ink-2); }
  .cell-no { color: var(--ink-3); }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: sticky; top: var(--bar); z-index: 30; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; scrollbar-width: none; }
    .side a { flex: none; }
    .side hr, .side-foot { display: none; }
    #main { padding: 16px; }
    .user span:last-child { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="khabo prototypes"><svg class="mk" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#2A3DB8"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="19.2" cy="13" r="3.1" fill="#F5A300"/></svg><span>khabo</span><span class="brand-ctx">Admin</span></a>
  <span class="grow"></span>
  <span class="proto-note"><svg class="ico sm" aria-hidden="true"><use href="#i-info"/></svg>Prototype. Edits are saved in this browser only.</span>
  <button class="btn sm ghost" id="reset" type="button">Reset demo data</button>
  <span class="user"><span class="avatar">RA</span><span>Rumana Akter, Admin</span></span>
</header>
<div class="shell">
  <aside class="side" aria-label="Admin sections"><nav id="nav" style="display:contents"></nav>
    <div class="side-foot"><a href="dashboard.html" style="height:auto;padding:0">Owner dashboard</a><a href="index.html" style="height:auto;padding:0">All prototypes</a></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<noscript><p style="padding:24px">This prototype needs JavaScript.</p></noscript>
<script defer src="../assets/js/data.js"></script>
<script defer src="../assets/js/icons.js"></script>
<script defer src="future.js"></script>
<script defer src="admin.js"></script>
</body>
</html>
