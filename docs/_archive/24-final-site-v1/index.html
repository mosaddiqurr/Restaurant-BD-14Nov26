  const tours = D.restaurants.filter(r => r.has3d);

      <div class="hero-d">
        <h1>${t('hq')}</h1>
        <form class="scard" action="search.html" data-search role="search">
          <div class="fld"><label for="qd">${t('what')}</label><input id="qd" name="q" type="search" placeholder="${t('whatPh')}" autocomplete="off"></div>

          <div class="fld"><label for="bd">${t('bpp')}</label><select id="bd" name="max"><option value="2000">${t('anyBudget')}</option><option value="300">${t('under', { p: tk(300) })}</option><option value="600">${t('under', { p: tk(600) })}</option><option value="1200">${t('under', { p: tk(1200) })}</option></select></div>

        </form>
      </div>
      <div class="chips hero-chips" role="group" aria-label="${t('filters')}">${quickHTML}</div>
      <div class="meta hide-m"><span>${ic('storefront')} ${t('metaA', { n: N(total) })}</span><span>${ic('seal-check')} ${t('metaB')}</span><span>${ic('map-pin')} ${t('metaC')}</span></div>
    </div>
  </section>

    <div class="flow" aria-label="${t('onNow')}"><div class="tr">${pills}${pills.replace(/<a /g, '<a tabindex="-1" aria-hidden="true" ')}</div></div>

  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sh"><div><h2>${t('openNear')}</h2><p>${t('openNearSub', { a: '<span data-area-label>' + APP.areaLabel() + '</span>' })}</p></div><a class="lnk" href="${href('search.html')}">${t('seeAll')}${ic('arrow-right')}</a></div>
    <div class="chips" role="group" aria-label="${t('budget')}" style="margin-bottom:16px">${budgets.map(([k, l], i) => `<button class="chip" data-bud="${k}" aria-pressed="${i === 0}">${l}</button>`).join('')}</div>
    <div class="rail" id="near"></div>
  </div></section>

  <section class="sec" id="ask"><div class="wrap"><div class="aib">
    <svg class="kantha" viewBox="0 0 1200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M0 7H1200" stroke="#F5A300" stroke-width="2" stroke-dasharray="8 8"/></svg>
    <div class="intro">
      <span class="badge" style="background:rgba(255,255,255,.08);color:#FFC044">${ic('sparkle', 1)}khabo AI</span>
      <h2 style="margin-top:14px">${t('aiTitle')}</h2>
      <p class="lead">${t('aiLead')}</p>
      <div class="exs">${[['exBn', 'ex1'], ['exEn', 'ex2'], ['exBl', 'ex3']].map(([l, e]) => `<button class="ex" data-ex="${t(e)}">${ic('chat-circle-dots')}<span><small>${t(l)}</small>${t(e)}</span></button>`).join('')}</div>
    </div>
    <div class="chatbox">
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="aiin" id="aiForm"><input id="aiQ" placeholder="${t('aiPh')}" aria-label="${t('aiPh')}" autocomplete="off" enterkeyhint="send"><button type="button" class="mic" aria-label="${t('voice')}" data-demo>${ic('microphone')}</button><button class="go" aria-label="${t('send')}">${ic('paper-plane-right', 1)}</button></form>
      <p class="note">${ic('shield-check', 1)}${t('aiNote')}</p>
    </div>
  </div></div></section>

  <section class="sec"><div class="wrap">
    <div class="sh"><div><h2>${t('toursT')}</h2><p>${t('toursSub')}</p></div></div>
    <div class="tgrid">
      <div class="tt" id="ttile">
        <div class="poster" style="background-image:url('${D.PANO(featR.tour[0].pano)(512)}')"></div>

        <div class="bt"><b>${L(featR.name)}</b><span>${L(featR.spot)} · ${t('roomsN', { n: N(featR.tour.length) })} · ${t('captured', { d: featR.photosDate })}</span>

      </div>
      <div class="tlist">${tours.filter(r => r.id !== featR.id).map(r => `<button class="trow" data-tour="${r.id}"><span class="tb" style="background-image:url('${D.PANO(r.tour[0].pano)(256)}')"></span><span><b>${L(r.name)}</b><span>${L(APP.areaOf(r.area))} · ${t('roomsN', { n: N(r.tour.length) })}</span></span><span class="go">${ic('arrow-right')}</span></button>`).join('')}</div>
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sh"><h2>${t('dealT')}</h2><span class="badge out">${ic('push-pin')}${t('featured')}</span></div>
    <a class="deal" href="${href('restaurant.html?id=' + featR.id + '#menu')}">
      <div class="im"><img src="${img(featR.deal.p, 1000, 640)}" alt="" loading="lazy"><span class="off">−${N(featR.deal.off)}</span></div>
      <div class="bd"><span class="t2" style="font-size:14px">${L(featR.name)} · ${L(APP.areaOf(featR.area))}</span><h3>${L(featR.deal)}</h3>
        <div class="row"><span class="price lg">${tk(featR.deal.price)}</span><span class="was">${tk(featR.deal.was)}</span></div>
        <p class="t2" style="margin-top:8px;font-size:14px">${L(featR.deal.when)}</p>
        <div class="row" style="margin-top:16px"><span class="btn">${t('seeDeal')}${ic('arrow-right')}</span><span class="fresh">${t('checkedShort', { n: N(featR.checked) })}</span></div></div>
    </a>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sh"><h2>${t('areasT')}</h2></div>
    ${['dhaka', 'bogura'].map(c => `<div class="cityh">${L(D.cities[c])}</div><div class="areas">${D.areas.filter(a => a.city === c).map(a => `<a class="area" href="${href('search.html?area=' + a.id)}"><b>${L(a)}</b><span>${t('restaurantsN', { n: N(a.n) })}</span></a>`).join('')}</div>`).join('')}
  </div></section>

  <section class="sec"><div class="wrap"><div class="bizb">
    <div><span class="badge pri">${ic('storefront')}${t('bizBadge')}</span><h2 style="margin-top:14px">${t('bizT')}</h2><p class="lead">${t('bizLead')}</p>
      <ul><li>${ic('camera')}${t('biz1')}</li><li>${ic('qr-code')}${t('biz2')}</li><li>${ic('chart-line-up')}${t('biz3')}</li></ul>
      <div class="cta"><a class="btn" href="${href('business.html')}">${t('bizCta')}</a><a class="btn line" href="${href('business.html#join')}">${t('bizCta2')}</a></div></div>
    <div class="stat"><div><b>${t('st1v')}</b><span>${t('st1')}</span></div><div><b>${t('st2v')}</b><span>${t('st2')}</span></div><div><b>${t('st3v')}</b><span>${t('st3')}</span></div></div>
  </div></div></section>`;

  /* search forms */
  main.querySelectorAll('[data-search]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault(); const q = (f.querySelector('[name=q]').value || '').trim(); const mx = f.querySelector('[name=max]');
    if (mx) { const F = APP.getF(); F.max = Number(mx.value); APP.setF(F); }
    location.href = href('search.html' + (q ? '?q=' + encodeURIComponent(q) : ''));
  }));
  main.querySelectorAll('.scard [data-area-open]').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); APP.openArea(); } }));

  /* quick chips → search with that filter */
  main.addEventListener('click', e => {
    const q = e.target.closest('[data-quick]'); if (!q) return;
    const F = APP.F0(); const k = q.dataset.quick;
    if (k === 'open') F.open = true; else if (k === 'u500') F.max = 500; else if (k === '3d') F.media = ['3d']; else if (k === 'buffet') F.offers = ['buffet']; else F.fac = [k];
    APP.setF(F); location.href = href('search.html');
  });

  /* categories more */
  const moreBtn = main.querySelector('[data-more]'), moreBox = main.querySelector('#morecats');
  moreBtn.addEventListener('click', () => { const open = !moreBox.classList.contains('open'); moreBox.classList.toggle('open', open); moreBtn.setAttribute('aria-expanded', String(open)); moreBtn.querySelector('.ci').innerHTML = open ? ic('caret-up') : '+' + N(D.moreCats.length); moreBtn.querySelector('[data-morelbl]').textContent = open ? t('less') : t('more'); });

  /* open now near you */
  const nearEl = main.querySelector('#near'); let bud = 'all';
  const inBud = r => bud === 'all' || (bud === 'b1' && r.ppl[0] < 300) || (bud === 'b2' && r.ppl[0] >= 300 && r.ppl[0] < 600) || (bud === 'b3' && r.ppl[0] >= 600 && r.ppl[0] < 1200) || (bud === 'b4' && r.ppl[1] >= 1200);
  function drawNear() {
    const home = APP.areaOf(APP.getArea());
    const list = D.restaurants.filter(r => openState(r).open && inBud(r)).sort((a, b) => (a.area === home.id ? -1 : 0) - (b.area === home.id ? -1 : 0) || a.dist - b.dist);
    nearEl.innerHTML = list.length ? list.map(r => rcard(r)).join('') : `<div class="empty-s" style="grid-column:1/-1">${ic('moon-stars')}<b>${t('noNear')}</b></div>`;
  }
  main.querySelectorAll('[data-bud]').forEach(b => b.addEventListener('click', () => { bud = b.dataset.bud; main.querySelectorAll('[data-bud]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawNear(); }));
  document.addEventListener('kb:area', drawNear); drawNear();

  /* Ask AI scroll + focus */
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-ask]'); if (!a) return;
    const tgt = document.getElementById('ask'); if (!tgt) return; e.preventDefault();
    tgt.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    history.replaceState(null, '', '#ask'); setTimeout(() => document.getElementById('aiQ').focus({ preventScroll: true }), 500);
  });

  /* AI chat */
  const chat = main.querySelector('#chat');
  const planCard = res => {
    const r = res.r, pl = res.pl, st = openState(r);
    return `<div class="plan"><div class="ph-top"><img src="${img(r.hero[0], 160, 160)}" alt=""><div><b>${L(r.name)}</b><span>${L(APP.areaOf(r.area))} · ${N(r.dist)} ${t('km')} · ${st.short}</span></div></div>
      <ul>${pl.lines.map(l => `<li><span>${L(l.m.name)} × ${N(l.q)}</span><span>${tk(l.m.price * l.q)}</span></li>`).join('')}${pl.vat + pl.svc ? `<li><span>${t('vatSvc')} (${N(r.vat + r.service)}%)</span><span>${tk(pl.vat + pl.svc)}</span></li>` : ''}</ul>
      <div class="tot"><div>${t('total')}<div class="pp">${t('each', { p: tk(pl.each) })}</div></div><span class="price">${tk(pl.tot)}</span></div>
      <div class="pf"><span style="color:#4ED69A;font-weight:700">● ${t('checkedAgo', { n: N(r.checked) })}</span><a href="${href('restaurant.html?id=' + r.id + '#menu')}">${t('openMenu')} →</a></div></div>
      <div class="fu"><button data-addall='${JSON.stringify({ r: r.id, l: pl.lines.map(l => [l.m.id, l.q]) })}'>${ic('receipt')}${t('addAll')}</button><a href="tel:${r.phone.replace(/[^+\d]/g, '')}">${ic('phone')}${t('call')}</a>${res.p.budget ? `<button data-ex="${(res.lg === 'bn' ? '' : '') + (res.p.people) + (res.lg === 'en' ? ' people, ' : ' jon, ') + Math.round(res.p.budget * 0.7) + (res.lg === 'en' ? ' taka total' : ' taka')}">${ic('trend-down')}${t('cheaper')}</button>` : ''}</div>`;
  };
  function ask(q, instant) {
    if (!q) return;
    chat.insertAdjacentHTML('beforeend', `<div class="msg me">${APP.esc(q)}</div>`);
    const typing = document.createElement('div'); typing.className = 'msg bot'; typing.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; typing.style.padding = '0';
    if (!instant) chat.appendChild(typing);
    const done = () => {
      typing.remove(); const res = KAI.respond(q);
      chat.insertAdjacentHTML('beforeend', `<div class="msg bot">${res.text}</div>${res.r ? planCard(res) : ''}`);
      if (!instant) chat.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    instant ? done() : setTimeout(done, 750);
  }
  main.querySelector('#aiForm').addEventListener('submit', e => { e.preventDefault(); const i = main.querySelector('#aiQ'); const q = i.value.trim(); i.value = ''; chat.innerHTML = ''; ask(q); });
  main.addEventListener('click', e => {
    const ex = e.target.closest('[data-ex]'); if (ex) { chat.innerHTML = ''; ask(ex.dataset.ex); return; }
    const aa = e.target.closest('[data-addall]'); if (aa) { const d = JSON.parse(aa.dataset.addall); d.l.forEach(([id, q]) => APP.Bill.add(d.r, id, q)); location.href = href('restaurant.html?id=' + d.r + '#menu'); }
  });
  ask(t('ex1'), true);

  /* live 3D tile */
  if (window.IntersectionObserver) {
    const tile = main.querySelector('#ttile');
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); VIEW.mountTourTile(tile, featR.tour[0].pano); } }, { rootMargin: '200px' });
    io.observe(tile);
  }
})();
</script>
</body>
</html>
