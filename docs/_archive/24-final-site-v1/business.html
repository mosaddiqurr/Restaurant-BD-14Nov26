    fn1:'রেস্টুরেন্টের নাম', fn2:'এলাকা', fn3:'আপনার নাম', fn4:'ফোন (হোয়াটসঅ্যাপ)', fn5:'কোন প্ল্যানে আগ্রহী', notSure:'এখনো ঠিক করিনি', send:'ভিজিটের অনুরোধ পাঠান', thanks:'ধন্যবাদ। আমাদের টিম এক কর্মদিবসের মধ্যে কল করবে।'
  };
  const C = lang === 'bn' ? B : E; const c = k => C[k] != null ? C[k] : E[k];
  APP.shell({ active: 'biz', title: c('badge') });

  const price = { dhaka: [1999, 4999, 9999], bogura: [1499, 4499, 9499] };
  let city = 'dhaka';
  const plans = () => {
    const names = ['Starter', 'Pro', 'Premium'], fors = [c('s_for'), c('p_for'), c('m_for')], feats = [c('sf'), c('pf'), c('mf')];
    return names.map((nm, i) => `<div class="plan-c${i === 1 ? ' pop' : ''}">${i === 1 ? `<span class="popb">${c('popular')}</span>` : ''}
      <h3>${nm}</h3><p class="for">${fors[i]}</p><div class="amt"><b>${tk(price[city][i])}</b><span>${c('mo')}</span></div><div class="day">${c('day').replace('{d}', tk(Math.round(price[city][i] / 30)))}</div>
      <ul>${i ? `<li class="inh">${ic('check')}${c('incl').replace('{p}', names[i - 1])}</li>` : ''}${feats[i].map(f => `<li>${ic('check-circle', 1)}${f}</li>`).join('')}</ul>
      <a class="btn ${i === 1 ? '' : 'line'} blk" href="#join" data-plan="${nm}">${c('choose').replace('{p}', nm)}</a></div>`).join('');
  };
  const feat = (i, k, tier) => `<div class="feat-c"><span class="fi">${ic(i)}</span><h3>${c(k)}</h3><p>${c(k + 'p')}</p><span class="tier">${c(tier)}</span></div>`;

  document.getElementById('main').innerHTML = `
  <section class="wrap"><div class="bhero">
    <div><span class="badge pri">${ic('storefront')}${c('badge')}</span><h1 style="margin-top:16px">${c('h1')}</h1><p class="lead">${c('lead')} <b style="color:var(--tx)">${c('from').replace('{d}', tk(1999)).replace('{b}', tk(1499))}</b></p>
      <div class="cta"><a class="btn lg" href="#join">${ic('calendar-check')}${c('cta1')}</a><a class="btn lg line" href="#plans">${c('cta2')}</a></div>
      <div class="kk"><span>${ic('check-circle', 1)}${c('k1')}</span><span>${ic('check-circle', 1)}${c('k2')}</span><span>${ic('check-circle', 1)}${c('k3')}</span></div></div>
    <div><div class="phone"><iframe src="${href('restaurant.html?id=shahi-handi&frame=1')}" title="${APP.esc(c('live'))}" loading="lazy"></iframe>
      <span class="tag">${ic('cube-focus')}${c('tag1')}</span><span class="tag t2">${ic('seal-check', 1)}${c('tag2')}</span></div>
      <p class="t2" style="text-align:center;font-size:13px;margin-top:12px">${ic('hand-pointing')} ${c('live')}</p></div>
  </div></section>

  <section class="sec"><div class="wrap"><div class="sh"><div><h2>${c('vsT')}</h2><p>${c('vsSub')}</p></div></div>
    <div class="vs"><div class="vsc"><h3>${c('a_t')}</h3><div class="big">${c('a_p')}</div><span class="t2" style="font-size:13.5px">${c('a_s')}</span><ul>${['a1', 'a2', 'a3', 'a4'].map(k => `<li>${ic('x-circle', 1).replace('<i ', '<i class="x" ').replace('class="x" class="', 'class="x ')}${c(k)}</li>`).join('')}</ul></div>
      <div class="vsc us"><h3 style="color:#fff">${c('u_t')}</h3><div class="big">${c('u_p')}</div><span style="font-size:13.5px;color:var(--inkTx2)">${c('u_s')}</span><ul>${['u1', 'u2', 'u3', 'u4'].map(k => `<li>${ic('check-circle', 1)}${c(k)}</li>`).join('')}</ul></div></div>
  </div></section>

  <section class="sec"><div class="wrap"><div class="sh"><div><h2>${c('jT')}</h2><p>${c('jSub')}</p></div></div>
    <div class="journey">${[['j1', 'magnifying-glass'], ['j2', 'cube-focus'], ['j3', 'whatsapp-logo'], ['j4', 'receipt']].map(([k, i], n) => `<div class="jstep"><span class="n">${N(n + 1)}</span><h3>${c(k)}</h3><p>${c(k + 'p')}</p><div class="ex">${ic(i)} ${c(k + 'x')}</div></div>`).join('')}</div>
  </div></section>

  <section class="sec"><div class="wrap"><div class="sh"><div><h2>${c('fT')}</h2><p>${c('fSub')}</p></div></div>
    <div class="feats">${feat('browser', 'f1', 'tAll')}${feat('camera', 'f2', 'tAll')}${feat('qr-code', 'f5', 'tAll')}${feat('seal-check', 'f6', 'tAll')}${feat('chart-line-up', 'f7', 'tAll')}${feat('video-camera', 'f3', 'tPro')}${feat('cube-focus', 'f4', 'tPro')}${feat('cooking-pot', 'f8', 'tPro')}${feat('push-pin', 'f9', 'tPrem')}</div>
  </div></section>

  <section class="sec"><div class="wrap"><div class="bizb" style="align-items:start">
    <div><h2>${c('rT')}</h2><p class="lead">${c('rSub')}</p>
      <ul><li>${ic('eye')}${c('r1')}, ${c('r2')}, ${c('r3')}</li><li>${ic('bowl-food')}${c('rTop')}</li><li>${ic('scales')}${c('rCmp')}</li></ul></div>
    <div class="rep"><div class="hd"><span>${c('rEx')}</span><span class="badge">${ic('file-pdf')}PDF</span></div><h3>Shahi Handi House</h3>
      <div class="kpis">${[['r1', 4820, 18], ['r2', 1236, 9], ['r3', 312, 22], ['r4', 198, 6]].map(([k, v, g]) => `<div><b>${N(APP.fmt(v))}</b><span>${c(k)}</span><em> ▲ ${N(g)}%</em></div>`).join('')}</div>
      <h4 style="font-size:14px;margin-top:16px">${c('rTop')}</h4><div class="cmpt">${[['Mutton Kacchi Biryani', 1240], ['Kacchi Handi for 4', 806], ['Chicken Chap', 512]].map(([n, v], i) => `<div><span>${N(i + 1)}. ${n}</span><span></span><b>${N(APP.fmt(v))}</b></div>`).join('')}</div>
      <h4 style="font-size:14px;margin-top:16px">${c('rCmp')}</h4><div class="cmpt"><div class="you"><span>${c('you')}</span><span></span><b>${tk(380)}</b></div><div><span>${c('avgA')}</span><span></span><b>${tk(352)}</b></div><div><span>${c('lowA')}</span><span></span><b>${tk(320)}</b></div></div></div>
  </div></div></section>

  <section class="sec" id="plans"><div class="wrap"><div class="sh"><div><h2>${c('pT')}</h2><p>${c('pSub')}</p></div><div class="seg" role="group" aria-label="City"><button data-city="dhaka" aria-pressed="true">${c('dhaka')}</button><button data-city="bogura" aria-pressed="false">${c('bogura')}</button></div></div>
    <div class="plans" id="plancards" style="margin-top:26px">${plans()}</div>
    <p class="trust" style="margin-top:18px">${ic('seal-check', 1)}<span>${c('founding')}</span></p>
  </div></section>

  <section class="sec"><div class="wrap" style="max-width:900px"><div class="sh"><h2>${c('faqT')}</h2></div>
    <div class="faq">${[1, 2, 3, 4, 5, 6].map(i => `<details${i === 1 ? ' open' : ''}><summary>${c('q' + i)}${ic('plus')}</summary><p>${c('a' + i + 'x')}</p></details>`).join('')}</div>
  </div></section>

  <section class="sec" id="join"><div class="wrap"><div class="bizb" style="align-items:start">
    <div><h2>${c('formT')}</h2><p class="lead">${c('formSub')}</p></div>
    <form class="form" id="lead">
      <label>${c('fn1')}<input required name="rn" autocomplete="organization"></label>
      <label>${c('fn2')}<select name="area">${D.areas.map(a => `<option>${L(a)}, ${L(D.cities[a.city])}</option>`).join('')}</select></label>
      <label>${c('fn3')}<input required name="nm" autocomplete="name"></label>
      <label>${c('fn4')}<input required name="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"></label>
      <label class="full">${c('fn5')}<select name="plan" id="planSel"><option>${c('notSure')}</option><option>Starter</option><option>Pro</option><option>Premium</option></select></label>
      <button class="btn lg full" type="submit">${ic('paper-plane-right', 1)}${c('send')}</button>
    </form>
  </div></div></section>`;

  const main = document.getElementById('main');
  main.querySelectorAll('[data-city]').forEach(b => b.addEventListener('click', () => { city = b.dataset.city; main.querySelectorAll('[data-city]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); main.querySelector('#plancards').innerHTML = plans(); }));
  main.addEventListener('click', e => { const p = e.target.closest('[data-plan]'); if (p) main.querySelector('#planSel').value = p.dataset.plan; });
  main.querySelector('#lead').addEventListener('submit', e => { e.preventDefault(); APP.toast(c('thanks')); e.target.reset(); });
})();
</script>
</body>
</html>
