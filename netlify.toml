# Netlify: connect this GitHub repo and every push to main goes live by itself.
# docs/ and archive/ are not part of the website.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Netlify's Next.js support. Named here on purpose: this site was first made by drag and drop,
# so Netlify does not switch it on by itself, and without it every page shows "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"
